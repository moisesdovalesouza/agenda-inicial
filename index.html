<!DOCTYPE html>
<html lang="pt-BR" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda Inicial</title>
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#181816" media="(prefers-color-scheme: dark)">
<meta name="application-name" content="Agenda Inicial">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%231c1b19%22/%3E%20%3Crect%20x%3D%2213%22%20y%3D%2210%22%20width%3D%2238%22%20height%3D%2244%22%20rx%3D%223%22%20fill%3D%22%23f5f0e6%22/%3E%20%3Cpath%20d%3D%22M38%2010h8v17l-4-3-4%203z%22%20fill%3D%22%23c9982c%22/%3E%20%3Ccircle%20cx%3D%2223%22%20cy%3D%2234%22%20r%3D%224.2%22%20fill%3D%22%23c9982c%22/%3E%20%3Crect%20x%3D%2230%22%20y%3D%2232%22%20width%3D%2215%22%20height%3D%224%22%20rx%3D%222%22%20fill%3D%22%232a2824%22/%3E%20%3Ccircle%20cx%3D%2223%22%20cy%3D%2244%22%20r%3D%222.6%22%20fill%3D%22%232a2824%22/%3E%20%3Crect%20x%3D%2230%22%20y%3D%2242.2%22%20width%3D%2211%22%20height%3D%223.6%22%20rx%3D%221.8%22%20fill%3D%22%238e8778%22/%3E%20%3C/svg%3E">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icone-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icone-192.png">
<link rel="apple-touch-icon" href="assets/icone-180.png">
<style>
:root{
  --bg:#fbfaf7; --bg2:#f4f2ec; --bg3:#eeebe4; --text:#262522; --muted:#77736a; --faint:#aaa59a;
  --border:#e6e2d8; --hover:#efece4; --accent:#a87d1e; --accent-strong:#87630f; --accent-bg:#f6eed8; --on-accent:#ffffff;
  --danger:#a9432f; --ok:#4f7a4b; --shadow:0 1px 2px rgba(40,35,25,.06),0 6px 18px rgba(40,35,25,.07);
  --r:4px; --s1:4px; --s2:8px; --s3:16px; --s4:24px; --s5:32px; --s6:48px; --s7:64px;
  --page-x:96px; --content:720px; --row:28px; --side-w:240px; --edge:16px;
  --fs:14px; --fs-s:12px; --fs-h1:30px; --fs-h2:16px;
  --font:"Segoe UI Variable Text","Segoe UI",-apple-system,ui-sans-serif,system-ui,Helvetica,Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
}
html[data-theme="dark"]{
  --bg:#181816; --bg2:#1f1e1b; --bg3:#252420; --text:#e8e5de; --muted:#a09b90; --faint:#6d6960;
  --border:#2f2d29; --hover:#2a2925; --accent:#d4a845; --accent-strong:#e2bb62; --accent-bg:#30291a; --on-accent:#181816;
  --danger:#e07a68; --ok:#8fb58b; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    --bg:#181816; --bg2:#1f1e1b; --bg3:#252420; --text:#e8e5de; --muted:#a09b90; --faint:#6d6960;
    --border:#2f2d29; --hover:#2a2925; --accent:#d4a845; --accent-strong:#e2bb62; --accent-bg:#30291a; --on-accent:#181816;
    --danger:#e07a68; --ok:#8fb58b; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:var(--fs)/1.55 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
::selection{background:var(--accent-bg)}
.app{display:grid;grid-template-columns:var(--side-w) 1fr;height:100vh}

/* ---------- Sidebar ---------- */
.side{background:var(--bg2);border-right:1px solid var(--border);box-shadow:inset -1px 0 0 rgba(255,255,255,.25);display:flex;flex-direction:column;min-height:0}
.brand{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;padding:var(--s3) var(--edge) var(--s2)}
.brand .mark{width:28px;height:28px;display:block}
.brand .mark svg{width:28px;height:28px;display:block;border-radius:7px;box-shadow:0 0 0 1px var(--border)}
.brand .mark img{max-width:28px;max-height:28px}
.brand .mark span{font-weight:700;font-size:13px;color:var(--accent)}
.brand b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.brand small{display:block;font-size:11px;color:var(--muted);line-height:1.3;letter-spacing:.02em}
.logo-wide{padding:0 var(--edge) var(--s2)}
.logo-wide img{max-width:100%;max-height:34px;display:block}
.nav{padding:var(--s2) var(--s2);overflow:auto;flex:1}
.nav>*+*{margin-top:1px}
.nav .grp{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;height:var(--row);display:flex;align-items:flex-end;padding:0 var(--s2) 6px;margin-top:var(--s3)}
.nav a{display:grid;grid-template-columns:20px 1fr auto;gap:var(--s2);align-items:center;height:var(--row);padding:0 var(--s2);font-size:14px;border-radius:var(--r);text-decoration:none;color:var(--text);cursor:pointer;user-select:none}
.nav a:hover{background:var(--hover)}
.nav a.on{background:var(--hover);font-weight:600}
.nav a svg{width:16px;height:16px;color:var(--muted)}
.nav a .pill{font-size:11px;padding:0 6px;border-radius:var(--r);background:var(--accent);color:var(--on-accent);font-weight:600;line-height:18px}
.nav a .cnt{font-size:11px;color:var(--faint)}
.side-foot{border-top:1px solid var(--border);padding:var(--s3) var(--edge);font-size:var(--fs-s);color:var(--muted)}
.side-foot .who b{display:block;color:var(--text);font-size:13px}
.side-foot .row{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin-top:var(--s2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--faint);margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--accent)} .dot.err{background:var(--danger)}

/* ---------- Main ---------- */
.main{overflow:auto;min-width:0;position:relative}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:var(--s2);height:44px;padding:0 var(--s2) 0 var(--edge);background:var(--bg);border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--border)}
.crumbs{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs b{color:var(--text);font-weight:500}
.tools{display:flex;gap:var(--s1);align-items:center}
.page{max-width:calc(var(--content) + 2 * var(--page-x));margin:0 auto;padding:var(--s5) var(--page-x) 120px}
.page.wide{max-width:none}
h1.title{font-family:var(--serif);font-size:40px;line-height:1.2;font-weight:600;margin:0;letter-spacing:-.015em}
.kicker{margin:var(--s4) 0 var(--s2);font-size:11px;line-height:16px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.sub{color:var(--muted);font-size:14px;line-height:22px;margin:var(--s3) 0 var(--s5)}
.sec{margin-top:40px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);min-height:var(--row);border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:var(--s2)}
.sec-h h2{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.sec-h .tools .btn{height:24px;font-size:12px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:var(--fs-s)}
.empty{color:var(--faint);padding:var(--s2) 0;font-size:13px}

/* ---------- Controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:var(--row);padding:0 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);cursor:pointer;white-space:nowrap;font-size:13px}
.btn:hover{background:var(--hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.icon{width:var(--row);padding:0;justify-content:center}
.btn svg{width:15px;height:15px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.inp,select.inp,textarea.inp{height:var(--row);padding:0 var(--s2);border:1px solid var(--border);border-radius:var(--r);background:var(--bg);outline:none;min-width:0}
textarea.inp{height:auto;padding:var(--s2)}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
label.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;font-size:13px}
label.chk input{accent-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:transparent;height:26px;padding:0 10px;cursor:pointer;font-size:13px;color:var(--muted);border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--hover);color:var(--text);font-weight:600}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--border);border-bottom-width:2px;border-radius:var(--r);padding:0 4px;color:var(--muted)}

/* ---------- Banner ---------- */
.banner{display:grid;grid-template-columns:1fr auto;gap:var(--s3);align-items:center;border:1px solid var(--border);border-left:3px solid var(--accent);background:var(--accent-bg);padding:12px var(--s3);border-radius:var(--r);margin:0 0 var(--s3)}
.banner b{display:block}
.banner .muted{font-size:13px}
.banner .tools{flex-wrap:wrap;justify-content:flex-end}
.banner.info{border-left-color:var(--muted);background:var(--bg2)}

/* ---------- Quick log ---------- */
.qlog{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:var(--s2);align-items:center;border:1px solid var(--border);border-radius:var(--r);padding:var(--s1) var(--s1) var(--s1) var(--s2);background:var(--bg)}
.qlog:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.qlog .txt{border:0;outline:0;background:transparent;height:30px;min-width:0}
.qlog .time{width:112px}
.typebtns{display:flex;gap:2px}
.typebtns button{width:28px;height:28px;border:1px solid transparent;border-radius:var(--r);background:transparent;cursor:pointer;font-family:var(--mono);font-size:15px;color:var(--muted)}
.typebtns button.on{border-color:var(--border);background:var(--hover);color:var(--text)}
.hint{font-size:12px;line-height:18px;color:var(--faint);margin:var(--s2) 0 0}

/* ---------- Entries (bullet journal) ---------- */
.entries{list-style:none;margin:0 0 0 -18px;padding:0}
.entries .empty{padding-left:18px}
.entry{display:grid;grid-template-columns:18px 20px 1fr auto;gap:2px var(--s1);align-items:start;padding:3px 0;border-radius:var(--r);position:relative}
.entry:hover{background:var(--hover)}
.entry .sig{font-family:var(--mono);color:var(--accent);font-weight:700;text-align:center;line-height:24px;cursor:pointer}
.entry .bul{font-family:var(--mono);font-size:16px;line-height:24px;text-align:center;cursor:pointer;color:var(--text);user-select:none}
.entry .txt{line-height:24px;outline:none;min-height:24px;word-break:break-word;padding-right:var(--s1)}
.entry .txt[contenteditable="true"]{background:var(--bg);box-shadow:0 0 0 1px var(--accent);border-radius:2px;padding:0 4px}
.entry .meta{display:flex;gap:6px;align-items:center;line-height:24px;font-size:12px;color:var(--muted);white-space:nowrap}
.entry .time{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:6px;cursor:pointer}
.entry .acts{display:none;position:absolute;right:0;top:1px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:1px}
.entry:hover .acts{display:flex}
.entry:hover .meta{visibility:hidden}
.entry .acts button{width:26px;height:24px;border:0;background:transparent;border-radius:2px;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.entry .acts button:hover{background:var(--hover);color:var(--text)}
.entry .acts svg{width:14px;height:14px}
.entry.done .txt,.entry.cancelled .txt{color:var(--faint)}
.entry.cancelled .txt{text-decoration:line-through}
.entry.done .txt{text-decoration:line-through;text-decoration-color:var(--faint)}
.entry.migrated .txt,.entry.scheduled .txt{color:var(--faint)}
.entry.event .txt{font-weight:500}
.tag{display:inline-block;font-size:11px;line-height:16px;padding:0 5px;border:1px solid var(--border);border-radius:var(--r);color:var(--muted);vertical-align:1px}
.tag.g{border-color:var(--accent);color:var(--accent)}
.tag.acc{background:var(--accent-bg);border-color:transparent;color:var(--accent-strong)}
.daylabel{font-size:12px;line-height:16px;color:var(--muted);margin:var(--s3) 0 var(--s1);font-weight:600}

/* ---------- Notes ---------- */
.notes{width:100%;min-height:120px;border:1px solid transparent;border-radius:var(--r);padding:var(--s2);background:transparent;outline:none;resize:none;line-height:1.7;
  background-image:linear-gradient(var(--bg) 0, transparent 0);
}
.notes:hover{border-color:var(--border)}
.notes:focus{border-color:var(--accent);background:var(--bg)}
.dotgrid{background-image:radial-gradient(var(--border) 1px, transparent 1.2px);background-size:16px 16px;background-position:8px 8px}

/* ---------- Calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--border);border-left:1px solid var(--border)}
.cal .wd{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:var(--s1) var(--s2);border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--bg2)}
.cal .cell{min-height:112px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:var(--s1) 6px var(--s2);cursor:pointer;overflow:hidden;display:flex;flex-direction:column;gap:1px}
.cal .cell:hover{background:var(--bg2)}
.cal .cell.out{background:var(--bg2)}
.cal .cell.out .n{color:var(--faint)}
.cal .cell.wkend{background:color-mix(in srgb, var(--bg2) 55%, var(--bg))}
.cal .cell .hd{display:flex;align-items:center;justify-content:space-between;gap:4px;height:22px}
.cal .cell .n{font-size:13px;font-weight:500;min-width:22px;height:22px;display:grid;place-items:center;border-radius:var(--r)}
.cal .cell.today .n{background:var(--accent);color:var(--on-accent);font-weight:700;border-radius:50%}
.cal .cell .hol{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .it{font-size:12px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .it .b{font-family:var(--mono);display:inline-block;width:14px;color:var(--muted)}
.cal .it.ev{font-weight:500}
.cal .it.g{color:var(--accent-strong)}
.cal .it.done{color:var(--faint);text-decoration:line-through}
.cal .it.ponto{background:var(--accent-bg);color:var(--accent-strong);padding:0 4px;border-radius:2px;font-weight:600}
.cal .more{font-size:11px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:var(--s3);font-size:12px;color:var(--muted);margin-top:var(--s2)}
.legend span b{font-family:var(--mono);color:var(--text);margin-right:4px}

/* ---------- Future log ---------- */
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--border);border-left:1px solid var(--border)}
.fcell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:var(--s2) var(--s3) var(--s3);min-height:220px;display:flex;flex-direction:column}
.fcell h3{margin:0 0 var(--s2);font-family:var(--serif);font-size:17px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.fcell h3 small{font-weight:400;color:var(--muted);font-size:11px}
.fcell .entries{flex:1}
.fcell .entry{grid-template-columns:18px 20px 1fr auto}
.fcell .d{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:6px}
.fadd{display:grid;grid-template-columns:72px 1fr;gap:var(--s1);margin-top:var(--s2)}

/* ---------- Tables ---------- */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border);padding:6px var(--s2);height:var(--row)}
table.t td{border-bottom:1px solid var(--border);padding:6px var(--s2);vertical-align:middle;height:40px}
table.t th:first-child,table.t td:first-child{padding-left:0}
table.t th:last-child,table.t td:last-child{padding-right:0}
table.t tr:hover td{background:var(--bg2)}
table.t td.num{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
table.t td.acts{text-align:right;white-space:nowrap}
.fname{display:flex;align-items:center;gap:var(--s2)}
.ext{font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;width:38px;text-align:center;border:1px solid var(--border);border-radius:var(--r);color:var(--muted);line-height:18px;flex:none}

/* ---------- Dropzone ---------- */
.drop{border:1px dashed var(--faint);border-radius:var(--r);padding:var(--s4);text-align:center;color:var(--muted);background:var(--bg2)}
.drop.over{border-color:var(--accent);background:var(--accent-bg);color:var(--text)}

/* ---------- Cards / forms ---------- */
.card{border:1px solid var(--border);border-radius:var(--r);padding:var(--s3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.form{display:grid;grid-template-columns:184px 1fr;gap:var(--s2) var(--s4);align-items:center}
.form .full{grid-column:1/-1}
.kv{display:grid;grid-template-columns:184px 1fr;gap:var(--s2) var(--s4);font-size:14px;line-height:20px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.stat b{display:block;font-size:22px;font-weight:700;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
ol.steps{margin:0;padding-left:20px;line-height:1.8;font-size:13px}
pre.code{font-family:var(--mono);font-size:11.5px;line-height:1.5;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:var(--s2) var(--s3);max-height:220px;overflow:auto;white-space:pre}

/* ---------- Lists (collections) ---------- */
.check{display:grid;grid-template-columns:22px 1fr auto auto;gap:var(--s1);align-items:start;padding:3px 0 3px calc(var(--d,0) * 24px);border-radius:var(--r);position:relative}
.check[style*="--d:1"]::before,.check[style*="--d:2"]::before,.check[style*="--d:3"]::before{content:"";position:absolute;top:0;bottom:0;left:calc(var(--d) * 24px - 12px);border-left:1px solid var(--border)}
.check .meta{line-height:24px}
.check .ops{display:flex;opacity:0}
.check:hover .ops,.check:focus-within .ops{opacity:1}
.check .ops button{border:0;background:transparent;cursor:pointer;color:var(--muted);width:26px;height:24px;display:grid;place-items:center;border-radius:2px}
.check .ops button:hover{background:var(--bg);color:var(--text)}
.check .ops svg{width:14px;height:14px}
.check:hover{background:var(--hover)}
.check input{margin:5px 0 0 0;accent-color:var(--accent);width:14px;height:14px}
.check .txt{line-height:24px;outline:none}
.check.done .txt{color:var(--faint);text-decoration:line-through}
.title-edit{outline:none;border:0;background:transparent;font-family:var(--serif);font-size:40px;line-height:1.2;font-weight:600;letter-spacing:-.015em;width:100%;padding:0;margin:0}

/* ---------- Toast / misc ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:var(--r);font-size:13px;box-shadow:var(--shadow);z-index:50;opacity:0;transition:opacity .15s;pointer-events:none;max-width:80vw}
.toast.on{opacity:1}
#dp{position:fixed;opacity:0;width:1px;height:1px;pointer-events:none}
/* ---------- Visualizador ---------- */
.viewer{position:fixed;inset:0;z-index:40;background:rgba(15,15,14,.55);display:grid;padding:24px}
.viewer[hidden]{display:none}
.vpanel{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);display:grid;grid-template-rows:44px 1fr auto;min-height:0;overflow:hidden}
.vbar{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s2);align-items:center;padding:0 var(--s2) 0 var(--s3);border-bottom:1px solid var(--border)}
.vbar .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.vbar .nm small{font-weight:400;color:var(--muted);margin-left:var(--s2)}
.vbar .tools{gap:2px}
.vbar .sep{width:1px;height:20px;background:var(--border);margin:0 var(--s1)}
.vbar .zv{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:44px;text-align:center}
.vbody{overflow:auto;min-height:0;background:var(--bg3);position:relative}
.vbody.flush{overflow:hidden}
.vbody iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.vzoom{transform-origin:top center}
.vmsg{display:grid;place-items:center;height:100%;text-align:center;color:var(--muted);padding:var(--s5)}
.vmsg b{display:block;color:var(--text);font-size:15px;margin-bottom:var(--s1)}
.vmsg .tools{justify-content:center;margin-top:var(--s3)}
.vimg{display:grid;place-items:center;min-height:100%;padding:var(--s4)}
.vimg img{max-width:100%;max-height:calc(100vh - 160px);box-shadow:var(--shadow);background:repeating-conic-gradient(#e8e8e8 0 25%,#fff 0 50%) 0 0/16px 16px}
.vimg.full img{max-width:none;max-height:none}
.vtext{margin:0;padding:var(--s4) var(--s5);font:13px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;background:var(--bg);min-height:100%;color:var(--text)}
.vmedia{display:grid;place-items:center;height:100%;padding:var(--s4)}
.vmedia video{max-width:100%;max-height:100%}
.vdocx{padding:var(--s4) 0}
.vdocx .docx-wrapper{background:transparent!important;padding:0!important}
.vdocx .docx-wrapper>section.docx{box-shadow:var(--shadow);margin:0 auto var(--s4)!important}
.vsheet{background:var(--bg);min-height:100%}
.vsheet table{border-collapse:separate;border-spacing:0;font:12px/1.4 var(--font);color:var(--text)}
.vsheet th,.vsheet td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:2px 6px;white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis;height:22px}
.vsheet thead th{position:sticky;top:0;z-index:2;background:var(--bg2);color:var(--muted);font-weight:500;text-align:center;font-size:11px}
.vsheet tbody th{position:sticky;left:0;z-index:1;background:var(--bg2);color:var(--muted);font-weight:500;text-align:right;font-size:11px;min-width:40px}
.vsheet thead th:first-child{left:0;z-index:3}
.vsheet td.n{text-align:right;font-variant-numeric:tabular-nums}
.vsheet td.f{color:var(--muted);font-style:italic}
.vsheet .more{padding:var(--s2) var(--s3);color:var(--muted);font-size:12px}
.vtabs{display:flex;gap:0;border-top:1px solid var(--border);background:var(--bg2);overflow-x:auto}
.vtabs:empty{display:none}
.vtabs button{border:0;border-right:1px solid var(--border);background:transparent;height:30px;padding:0 var(--s3);cursor:pointer;font-size:12px;color:var(--muted);white-space:nowrap}
.vtabs button.on{background:var(--bg);color:var(--text);font-weight:600;box-shadow:inset 0 2px 0 var(--accent)}
.vpptx{padding:var(--s4);display:grid;justify-items:center}
.vpptx .pptx-preview-wrapper{background:transparent!important;margin:0 auto}
.vpptx .pptx-preview-slide-wrapper{box-shadow:var(--shadow);margin:0 auto var(--s4)!important}
.vload{display:grid;place-items:center;height:100%;color:var(--muted);font-size:13px}
@media print{.viewer{display:none!important}}
.fchips{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 4px}
.fchip{display:inline-flex;align-items:center;gap:4px;max-width:260px;height:20px;padding:0 6px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);font-size:11.5px;color:var(--text);text-decoration:none;cursor:pointer;line-height:18px}
.fchip:hover{border-color:var(--accent);background:var(--accent-bg)}
.fchip svg{width:12px;height:12px;color:var(--muted);flex:none}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .fchips{grid-column:3 / -1}
select.inp.mini{height:24px;font-size:12px;max-width:220px}
.page.hoje .notes{background-color:transparent}
.install{margin:0 var(--s2) var(--s2)}
.install .btn{width:100%;justify-content:center}
.foot-note{margin-top:var(--s6);padding-top:var(--s2);border-top:1px solid var(--border);font-size:11px;color:var(--faint)}
/* ---------- Subtarefas ---------- */
.entry{padding-left:calc(var(--d,0) * 24px)}
.entry.child::before{content:"";position:absolute;top:0;bottom:0;left:calc(var(--d) * 24px - 12px);border-left:1px solid var(--border)}
.subadd{display:grid;grid-template-columns:18px 20px 1fr;gap:2px var(--s1);align-items:center;padding:3px 0 3px calc(var(--d,1) * 24px)}
.subadd .bul{font-family:var(--mono);color:var(--faint);text-align:center}
.subadd .inp{height:26px}

/* ---------- Perfil ---------- */
.avatar{font-family:var(--serif);width:56px;height:56px;flex:none;display:grid;place-items:center;background:var(--text);color:var(--bg);font-weight:700;font-size:20px;letter-spacing:.02em;border-radius:var(--r);border-bottom:4px solid var(--accent)}
.prev{border:1px solid var(--border);padding:20px 24px;border-radius:var(--r);box-shadow:var(--shadow)}
.appcard{display:grid;grid-template-columns:64px 1fr;gap:var(--s3);align-items:center}
.appcard svg{width:64px;height:64px;display:block}

/* ---------- Relatórios (PDF) ---------- */
#print{display:none}
.rp{font:10pt/1.5 "Segoe UI",Calibri,Arial,sans-serif;color:#111;background:#fff}
.rp-h{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding-bottom:10px;border-bottom:2px solid #111}
.rp-logo img{max-height:42px;max-width:160px;display:block}
.rp-logo svg{width:42px;height:42px;display:block}
.rp-k{font-size:7.5pt;letter-spacing:.12em;text-transform:uppercase;color:#777}
.rp h1{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-size:17pt;margin:0;line-height:1.25;font-weight:700}
.rp-s{color:#555;font-size:9.5pt}
.rp-p{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:8.5pt;color:#444;padding:6px 0 8px;border-bottom:1px solid #b8892b;margin-bottom:12px}
.rp-p b{color:#111}
.rp h2{font-size:8.5pt;letter-spacing:.1em;text-transform:uppercase;color:#555;border-bottom:1px solid #bbb;padding-bottom:2px;margin:16px 0 6px;font-weight:600;break-after:avoid}
.rp h3{font-size:10pt;margin:12px 0 4px;break-after:avoid}
.rp ul{list-style:none;margin:0;padding:0}
.rp li{display:grid;grid-template-columns:16px 1fr auto;gap:4px;padding:1px 0 1px calc(var(--d,0) * 18px);break-inside:avoid}
.rp li .b{font-family:Consolas,monospace;text-align:center}
.rp li.done .x,.rp li.cancelled .x{text-decoration:line-through;color:#777}
.rp li.migrated .x,.rp li.scheduled .x{color:#888}
.rp li .m{color:#777;font-size:8.5pt;white-space:nowrap}
.rp .t{font-family:Consolas,monospace;font-size:9pt;color:#555;margin-right:6px}
.rp .notes{white-space:pre-wrap;border-left:2px solid #ddd;padding-left:8px;margin-top:6px;color:#222}
.rp table{width:100%;border-collapse:collapse;font-size:9pt}
.rp th,.rp td{border-bottom:1px solid #ddd;padding:3px 6px;text-align:left}
.rp th{color:#555;font-weight:600}
.rp .sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 8px}
.rp .sum div{border:1px solid #ccc;padding:6px 8px;font-size:8.5pt;color:#555}
.rp .sum b{display:block;font-size:14pt;color:#111;line-height:1.2}
.rp .sign{margin:56px auto 0;width:60%;text-align:center;border-top:1px solid #111;padding-top:4px;font-size:9pt;break-inside:avoid}
.rp .foot{margin-top:20px;font-size:7.5pt;color:#888;border-top:1px solid #ddd;padding-top:4px}
.rp .vazio{color:#888;font-style:italic}
@page{size:A4;margin:16mm 15mm 18mm;@bottom-right{content:"Página " counter(page) " de " counter(pages);font-size:8pt;color:#777}}
@media print{body.printing .app,body.printing .toast,body.printing #dp{display:none!important}body.printing #print{display:block}body.printing{background:#fff;color:#111}body.printing,body.printing html{height:auto}}
@media (max-width:1100px){:root{--page-x:48px}}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.page{padding:var(--s4) var(--s3)}.fgrid{grid-template-columns:1fr}.grid2,.grid3{grid-template-columns:1fr}}
@media print{.side,.topbar,.qlog,.hint,.acts{display:none!important}.app{display:block}.page{padding:0}}

function idb(){ return new Promise((res, rej) => { const r = indexedDB.open(IDB_NAME, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

async function initFS(){
  if (!fsSupported){ FS.state = 'unsupported'; return; }
  try {
    const h = await idbGet('root');
    if (!h) { FS.state = 'none'; return; }
    FS.root = h;
    const p = await h.queryPermission({ mode: 'readwrite' });
    FS.state = p === 'granted' ? 'granted' : 'prompt';
    if (FS.state === 'granted') await syncFromDisk(); else armAutoGrant();
  } catch(e){ FS.state = 'none'; }
}
/* O navegador só devolve o acesso à pasta depois de uma interação. A agenda
   aproveita o primeiro clique ou tecla em qualquer lugar, sem botão nem aviso. */
function armAutoGrant(){
  if (armAutoGrant.on) return; armAutoGrant.on = true;
  const go = async () => {
    window.removeEventListener('pointerdown', go, true); window.removeEventListener('keydown', go, true); armAutoGrant.on = false;
    if (FS.state !== 'prompt' || !FS.root) return;
    try {
      const p = await FS.root.requestPermission({ mode: 'readwrite' });
      if (p === 'granted'){ FS.state = 'granted'; await syncFromDisk(); render(false); }
      else armAutoGrant();
    } catch(e){ armAutoGrant(); }
  };
  window.addEventListener('pointerdown', go, true); window.addEventListener('keydown', go, true);
}

    if (h.name !== FOLDER_NAME && !hasData) h = await h.getDirectoryHandle(FOLDER_NAME, { create: true });
    FS.root = h; FS.state = 'granted'; await idbSet('root', h);

    catch(e){ alert('Não encontrei dados/agenda.json nessa pasta. Escolha a pasta da agenda anterior (a que tinha o arquivo Agenda Cagece.html).'); return; }
    if (S.entries.length && !confirm('Substituir o conteúdo atual pelos dados da agenda anterior? Uma cópia do atual fica em dados/backups.')) return;
    try { await writeRel(`dados/backups/antes-da-importacao-${Date.now()}.json`, new Blob([JSON.stringify(S)])); } catch(e){}
    let n = 0;
    async function copy(src, path){
      for await (const [name, h] of src.entries()){
        if (h.kind === 'directory') await copy(h, path + '/' + name);
        else { await writeRel(path + '/' + name, await h.getFile()); n++; }
      }

    try { await copy(await old.getDirectoryHandle('arquivos'), 'arquivos'); } catch(e){}

async function uniqueName(dir, name){
  const dot = name.lastIndexOf('.'); const base = dot > 0 ? name.slice(0, dot) : name; const ext = dot > 0 ? name.slice(dot) : '';

function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da); }
const _hol = {};
function holidays(y){
  if (_hol[y]) return _hol[y];
  const m = {};
  const fix = [[1,1,'Confraternização Universal'],[4,21,'Tiradentes'],[5,1,'Dia do Trabalho'],[9,7,'Independência'],[10,12,'N. Sra. Aparecida'],[11,2,'Finados'],[11,15,'Proclamação da República'],[11,20,'Consciência Negra'],[12,25,'Natal']];
  const ce = [[3,19,'São José (CE)'],[3,25,'Data Magna do Ceará'],[8,15,'N. Sra. da Assunção (Fortaleza)']];
  for (const [mo,d,n] of fix.concat(S.settings.cityHolidays ? ce : [])) m[`${y}-${pad(mo)}-${pad(d)}`] = n;
  const e = easter(y), add = (n, name) => { const d = new Date(e); d.setDate(d.getDate()+n); m[ymd(d)] = name; };
  add(-48,'Carnaval'); add(-47,'Carnaval'); add(-2,'Sexta-feira Santa'); add(60,'Corpus Christi');
  for (const h of S.settings.extraHolidays) if (h.date && h.date.startsWith(y+'-')) m[h.date] = h.name || 'Feriado';
  return (_hol[y] = m);
}
const holidayName = s => holidays(+s.slice(0,4))[s] || '';
const isBusiness = s => { const w = parse(s).getDay(); return w !== 0 && w !== 6 && !holidayName(s); };
function firstBusinessDay(monthKey){ let s = monthKey + '-01'; while (!isBusiness(s)) s = addDays(s, 1); return s; }
function resetHolidayCache(){ for (const k in _hol) delete _hol[k]; }

function pontoInfo(){
  const t = today(), mk = t.slice(0,7), fbd = firstBusinessDay(mk);
  const done = S.ponto.done || {};
  const pending = t >= fbd && !done[mk];
  const nextKey = t < fbd ? mk : addMonths(mk, 1);
  const next = pending ? fbd : firstBusinessDay(nextKey);
  const refOf = k => S.ponto.ref === 'anterior' ? addMonths(k, -1) : k;
  return { pending, fbd, mk, next, nextKey: pending ? mk : nextKey, refOf, linked: !!(S.ponto.kind === 'url' ? S.ponto.url : S.ponto.file) };
}

const G = { byDate: {}, loaded: {}, busy: false, error: '' };

function gCall(params, timeout = 25000){
  return new Promise((resolve, reject) => {
    const cb = 'gcb_' + uid(); const s = document.createElement('script');
    const q = new URLSearchParams(Object.assign({ token: S.google.token, callback: cb }, params));
    const done = () => { delete window[cb]; s.remove(); clearTimeout(t); };
    const t = setTimeout(() => { done(); reject(new Error('Tempo esgotado')); }, timeout);
    window[cb] = d => { done(); d && d.ok ? resolve(d) : reject(new Error((d && d.error) || 'Erro')); };
    s.onerror = () => { done(); reject(new Error('Falha de rede ou URL inválida')); };
    s.src = S.google.url.trim() + (S.google.url.includes('?') ? '&' : '?') + q.toString();
    document.head.appendChild(s);

      case 'list': {
        const ini = dia_(p.start), fim = dia_(p.end); fim.setDate(fim.getDate() + 1);
        r = { ok: true, events: c.getEvents(ini, fim).map(ev_) }; break;
      }
      case 'create': {
        const e = p.allDay === '1'
          ? c.createAllDayEvent(p.title || '(sem título)', dia_(p.date))
          : c.createEvent(p.title || '(sem título)', hora_(p.date, p.start), hora_(p.date, p.end || p.start));
        if (p.description) e.setDescription(p.description);
        r = { ok: true, event: ev_(e) }; break;
      }
      case 'update': {
        const e = c.getEventById(p.id);
        if (!e) throw new Error('Evento não encontrado');
        r = { ok: true, event: ev_(grava_(e, p)) }; break;
      }
      case 'delete': {
        const e = c.getEventById(p.id);
        if (e) e.deleteEvent();
        r = { ok: true }; break;
      }
      case 'bulk': {
        const itens = JSON.parse(p.items || '[]');
        itens.forEach(function (it) { const e = c.createAllDayEvent(it.title, dia_(it.date)); if (it.description) e.setDescription(it.description); });
        r = { ok: true, count: itens.length }; break;
      }
      default: throw new Error('Ação desconhecida');
    }
  } catch (err) {
    r = { ok: false, error: String(err && err.message || err) };
  }
  const s = JSON.stringify(r);
  if (p.callback) return ContentService.createTextOutput(p.callback + '(' + s + ');').setMimeType(ContentService.MimeType.JAVASCRIPT);
  return ContentService.createTextOutput(s).setMimeType(ContentService.MimeType.JSON);
}
`;
}

/* ---------------- Entradas ---------------- */
const SYM = { task: '•', event: '○', note: '–' };
function bulletOf(e){
  if (e.status === 'done') return e.type === 'event' ? '◉' : '×';
  if (e.status === 'migrated') return '>';
  if (e.status === 'scheduled') return '<';
  return SYM[e.type] || '•';
}
function parseQuick(raw){
  let text = raw.trim(), type = null, prio = false, time = '';
  const m1 = text.match(/^([*!])\s+/); if (m1){ prio = true; text = text.slice(m1[0].length); }
  const m2 = text.match(/^(o|-|\.)\s+/i); if (m2){ type = m2[1].toLowerCase() === 'o' ? 'event' : m2[1] === '-' ? 'note' : 'task'; text = text.slice(m2[0].length); }
  const m3 = text.match(/^(\d{1,2})[:h](\d{2})?\s+/); if (m3){ const h = +m3[1], mi = +(m3[2] || 0); if (h < 24 && mi < 60){ time = `${pad(h)}:${pad(mi)}`; text = text.slice(m3[0].length); } }
  return { text, type, prio, time };
}
let _seq = 0;
function addEntry(o){
  const par = o.parent ? byId(o.parent) : null;
  const e = Object.assign({ id: uid(), type: 'task', text: '', date: par ? par.date : null, month: null, time: '', status: 'open', prio: false, gId: '', parent: '', createdAt: Date.now() + (_seq++ % 1000) / 1000 }, o);
  if (e.date) e.month = e.date.slice(0,7);
  S.entries.push(e); return e;
}
const byId = id => S.entries.find(e => e.id === id);
function sortEntries(list){
  return list.slice().sort((a,b) => (a.time ? 0 : 1) - (b.time ? 0 : 1) || (a.time || '').localeCompare(b.time || '') || a.createdAt - b.createdAt);
}
const entriesOn = s => sortEntries(S.entries.filter(e => e.date === s && !e.parent));

/* Subtarefas: até MAXSUB níveis abaixo da tarefa principal */
const MAXSUB = 3;
const filesOf = id => S.files.filter(f => f.entry === id);
function moveFiles(fromId, toId, date){ for (const f of filesOf(fromId)){ f.entry = toId; if (date) f.link = date; } }
const kids = id => S.entries.filter(e => e.parent === id).sort((a,b) => a.createdAt - b.createdAt);
function depthOf(e){ let d = 0, p = e; while (p && p.parent){ p = byId(p.parent); d++; } return d; }
function subtree(e){ const out = []; (function w(x){ for (const k of kids(x.id)){ out.push(k); w(k); } })(e); return out; }
function heightOf(e){ let h = 0; for (const k of kids(e.id)) h = Math.max(h, 1 + heightOf(k)); return h; }
function progressOf(e){
  const s = subtree(e).filter(x => x.type === 'task' && !['cancelled','migrated','scheduled'].includes(x.status));
  return s.length ? { done: s.filter(x => x.status === 'done').length, total: s.length } : null;
}
function renderTree(e, opt = {}, depth = 0){
  let h = entryRow(e, Object.assign({}, opt, { depth }));
  for (const k of kids(e.id)) h += renderTree(k, {}, depth + 1);
  if (ui.subFor === e.id) h += `<li class="subadd" style="--d:${depth + 1}"><span></span><span class="bul">•</span><input class="inp" id="subtext" data-parent="${e.id}" placeholder="Subtarefa de nível ${depth + 1} · Enter adiciona · Esc encerra" autocomplete="off"></li>`;
  return h;
}
function completeEntry(e){
  e.status = 'done';
  const open = subtree(e).filter(x => x.status === 'open' && x.type === 'task');
  if (open.length && confirm(open.length === 1 ? 'Concluir também a subtarefa em aberto?' : `Concluir também as ${open.length} subtarefas em aberto?`)) open.forEach(x => x.status = 'done');
}
function deleteEntry(e){
  const st = subtree(e);
  if (st.length && !confirm(`Excluir "${e.text}" e ${st.length === 1 ? 'a sua subtarefa' : `as suas ${st.length} subtarefas`}?`)) return false;
  if (e.gId && confirm(`Excluir também do Google Agenda (${S.google.calName || 'Cagece'})?`)) gDelete(e.gId);
  const ids = new Set([e.id, ...st.map(x => x.id)]);
  S.entries = S.entries.filter(x => !ids.has(x.id));
  for (const f of S.files) if (ids.has(f.entry)) f.entry = '';
  return true;
}
function migrateTo(e, date, asSchedule){
  const copy = addEntry({ type: e.type, text: e.text, date, time: e.time, end: e.end, prio: e.prio, from: e.id, gId: '' });
  if (e.gId){ copy.gId = e.gId; e.gId = ''; }
  const map = { [e.id]: copy.id };
  for (const k of subtree(e)){
    if (k.status !== 'open' || !map[k.parent]) continue;
    const c = addEntry({ type: k.type, text: k.text, date, parent: map[k.parent], prio: k.prio, from: k.id });
    map[k.id] = c.id; moveFiles(k.id, c.id, date); k.status = asSchedule ? 'scheduled' : 'migrated'; k.to = date;
  }
  moveFiles(e.id, copy.id, date);
  e.status = asSchedule ? 'scheduled' : 'migrated'; e.to = date;
  if (copy.gId && copy.type === 'event') gPush(copy, true);
  return copy;
}
function indentEntry(e, dir){
  if (dir > 0){
    const sibs = e.parent ? kids(e.parent) : entriesOn(e.date);
    const prev = sibs[sibs.indexOf(e) - 1];
    if (!prev){ toast('Não há item acima para servir de tarefa principal.'); return false; }
    if (depthOf(prev) + 1 + heightOf(e) > MAXSUB){ toast(`O limite é de ${MAXSUB} níveis de subtarefa.`); return false; }
    e.parent = prev.id; e.date = prev.date; e.month = prev.month; e.createdAt = Date.now();
  } else {
    if (!e.parent) return false;
    const p = byId(e.parent); e.parent = p.parent || ''; e.createdAt = p.createdAt + 0.0005;
  }
  save(); return true;
}

function entryRow(e, opt = {}){
  const depth = opt.depth || 0;
  const cls = ['entry', e.type, e.status, depth ? 'child' : ''].join(' ');
  const acts = [];
  if (e.type === 'task' && e.status === 'open') acts.push(['done','Concluir',I.check]);
  if (e.status === 'done') acts.push(['reopen','Reabrir',I.sync]);
  if (e.type === 'task' && e.status === 'open' && depth < MAXSUB) acts.push(['sub', `Adicionar subtarefa (nível ${depth + 1} de ${MAXSUB})`, I.subtask]);
  if (!depth && e.status === 'open' && e.type !== 'note') acts.push(['tomorrow','Migrar para o próximo dia útil',I.migrate], ['sched','Agendar para outra data',I.sched]);
  if (!depth && e.status === 'open') acts.push(['time','Definir horário',I.clock]);
  if (e.status === 'open' && e.date) acts.push(['attach','Anexar arquivo a esta tarefa',I.clip]);
  acts.push(['prio','Prioridade',I.star]);
  if (!depth && e.type !== 'note' && gOn() && e.date && !e.gId && e.status === 'open') acts.push(['gpush',`Enviar ao Google Agenda (${S.google.calName || 'Cagece'})`,I.g]);
  if (e.status === 'open' || e.status === 'cancelled') acts.push(['cancel', e.status === 'cancelled' ? 'Restaurar' : 'Cancelar (irrelevante)', I.strike]);
  acts.push(['del','Excluir',I.trash]);
  const meta = [];
  const pr = progressOf(e);
  if (pr) meta.push(`<span class="tag ${pr.done === pr.total ? '' : 'acc'}" title="Subtarefas concluídas">${pr.done}/${pr.total}</span>`);
  if (opt.showDate && e.date) meta.push(`<span>${shortDate(e.date)}</span>`);
  if ((e.status === 'migrated' || e.status === 'scheduled') && e.to) meta.push(`<span>→ ${shortDate(e.to)}</span>`);
  if (e.gId) meta.push('<span class="tag g" title="Sincronizado com o Google Agenda">Google</span>');
  return `<li class="${cls}" data-id="${e.id}" style="--d:${depth}">
    <span class="sig" data-act="e-prio" title="Prioridade">${e.prio ? '*' : ''}</span>
    <span class="bul" data-act="e-bullet" title="${e.type === 'task' ? 'Clique para concluir / reabrir' : e.type === 'event' ? 'Evento' : 'Nota'}">${bulletOf(e)}</span>
    <span class="txt" data-act="e-edit">${opt.prefix || ''}${e.time ? `<span class="time" data-act="e-time">${e.time}${e.end ? '–' + e.end : ''}</span>` : ''}<span class="t">${esc(e.text)}</span></span>
    <span class="meta">${meta.join('')}</span>
    ${(fs => fs.length ? `<span class="fchips">${fs.map(f => `<a class="fchip" href="#" data-act="f-chip" data-e="${e.id}" data-fid="${f.id}" title="Visualizar ${esc(f.name)}">${I.clip}<span>${esc(f.name)}</span></a>`).join('')}</span>` : '')(filesOf(e.id))}
    <span class="acts">${acts.map(([a,t,ic]) => `<button data-act="e-${a}" title="${t}">${ic}</button>`).join('')}</span>
  </li>`;
}
function gRow(ev, showDate){
  return `<li class="entry event g" title="Evento do Google Agenda (${S.google.calName || 'Cagece'})">
    <span class="sig"></span><span class="bul" style="color:var(--accent)">○</span>
    <span class="txt">${ev.start ? `<span class="time">${ev.start}–${ev.end}</span>` : ''}${esc(ev.title)}${ev.location ? ` <span class="muted small">· ${esc(ev.location)}</span>` : ''}</span>

function calStart(mk){ const d = parse(mk + '-01'); d.setDate(1 - d.getDay()); return ymd(d); }
VIEWS.cal = () => {
  const mk = ui.month, start = calStart(mk), t = today();
  const cells = [];
  for (let i = 0; i < 42; i++){
    const s = addDays(start, i), dd = parse(s), out = s.slice(0,7) !== mk, w = dd.getDay();
    if (i >= 35 && out && s > mk + '-31') break;
    const es = entriesOn(s).filter(e => e.status !== 'migrated' && e.status !== 'scheduled');
    const gs = gEvents(s); const hol = holidayName(s);
    const items = [];
    if (s === firstBusinessDay(s.slice(0,7))) items.push(`<div class="it ponto">${S.ponto.done[s.slice(0,7)] ? '✓ ' : ''}Ponto</div>`);
    for (const e of es) items.push(`<div class="it ${e.type === 'event' ? 'ev' : ''} ${e.status === 'done' || e.status === 'cancelled' ? 'done' : ''}"><span class="b">${bulletOf(e)}</span>${e.time ? e.time + ' ' : ''}${esc(e.text)}${(p => p ? ` <span class="faint">${p.done}/${p.total}</span>` : '')(progressOf(e))}</div>`);
    for (const g of gs) items.push(`<div class="it ev g"><span class="b">○</span>${g.start ? g.start + ' ' : ''}${esc(g.title)}</div>`);
    const max = 4, more = items.length - max;
    cells.push(`<div class="cell ${out ? 'out' : ''} ${s === t ? 'today' : ''} ${(w === 0 || w === 6) && !out ? 'wkend' : ''}" data-act="cal-day" data-d="${s}">
      <div class="hd"><span class="n">${dd.getDate()}</span>${hol ? `<span class="hol" title="${esc(hol)}">${esc(hol)}</span>` : ''}</div>
      ${items.slice(0, more > 0 ? max - 1 : max).join('')}${more > 0 ? `<div class="more">+${more + 1} itens</div>` : ''}
    </div>`);
  }
  return topbar('Calendário', `
      <button class="btn icon ghost" data-act="m-prev" title="Mês anterior">${I.left}</button>
      <button class="btn ghost" data-act="m-today">Hoje</button>
      <button class="btn icon ghost" data-act="m-next" title="Próximo mês">${I.right}</button>
      <button class="btn ghost" data-act="pdf-month" title="Exportar a agenda do mês em PDF">${I.pdf}PDF do mês</button>
      ${gOn() ? `<button class="btn icon ghost" data-act="g-refresh" title="Atualizar do Google">${I.sync}</button>` : ''}`) + `
  <div class="page wide">
    <div class="kicker">Calendário mensal</div>
    <h1 class="title">${monthName(mk)}</h1>
    <p class="sub">1º dia útil: ${longDate(firstBusinessDay(mk))} · clique em um dia para abrir a página dele</p>
    <div class="cal">${WDS.map(w => `<div class="wd">${w}</div>`).join('')}${cells.join('')}</div>
    <div class="legend"><span><b>•</b>tarefa</span><span><b>×</b>concluída</span><span><b>○</b>evento</span><span><b>–</b>nota</span><span><b>&gt;</b>migrada</span><span><b>&lt;</b>agendada</span><span><b>*</b>prioridade</span><span style="color:var(--accent-strong)"><b style="color:inherit">○</b>Google Agenda</span></div>
  </div>`;
};

VIEWS.futuro = () => {
  const base = today().slice(0,7), t = today();
  const months = Array.from({ length: 6 }, (_, i) => addMonths(base, i));
  const block = mk => {
    const es = S.entries.filter(e => e.month === mk && !e.parent && e.status !== 'migrated' && e.status !== 'scheduled' && (e.date ? (e.date >= t && (e.type !== 'note')) : true))
      .sort((a,b) => (a.date || '9999').localeCompare(b.date || '9999') || (a.time || '').localeCompare(b.time || '') || a.createdAt - b.createdAt);
    const fbd = firstBusinessDay(mk);
    return `<div class="fcell"><h3>${monthName(mk)}<small>ponto: ${shortDate(fbd)}</small></h3>
      <ul class="entries">${es.map(e => entryRow(e, { prefix: e.date ? `<span class="d">${pad(parse(e.date).getDate())}</span>` : '' })).join('') || '<li class="empty">Sem registros.</li>'}</ul>
      <div class="fadd"><select class="inp" data-fday="${mk}" title="Dia (opcional)"><option value="">Dia</option>${Array.from({ length: new Date(+mk.slice(0,4), +mk.slice(5,7), 0).getDate() }, (_, i) => `<option>${i+1}</option>`).join('')}</select><input class="inp" data-fadd="${mk}" placeholder="Adicionar… (Enter)"></div>
    </div>`;
  };
  const upRows = [];

  return topbar('Registro futuro', gOn() ? `<button class="btn ghost" data-act="g-refresh">${I.sync}Atualizar do Google</button>` : '') + `
  <div class="page wide">
    <div class="kicker">Próximos seis meses</div>
    <h1 class="title">Registro futuro</h1>
    <p class="sub">Seis meses à frente, como no bullet journal. Escolha o dia para agendar; sem dia, o item fica no mês até você definir a data.</p>
    <div class="fgrid">${months.map(block).join('')}</div>
    <div class="sec"><div class="sec-h"><h2>Agendamentos — próximos 60 dias</h2></div>${upRows.join('') || '<div class="empty">Nenhum compromisso com data ou horário nos próximos 60 dias.</div>'}</div>
  </div>`;
};

function listRange(items, i){ let j = i + 1; while (j < items.length && items[j].level > items[i].level) j++; return j; }
function normLevels(items){ items.forEach((it, i) => { it.level = Math.max(0, Math.min(it.level || 0, i ? items[i-1].level + 1 : 0, MAXSUB)); }); }

  <div class="page">

    <input class="title-edit" id="ltitle" value="${esc(l.title)}" placeholder="Sem título">
    <p class="sub">${open} em aberto · ${done} concluído${done === 1 ? '' : 's'}</p>

    <div class="hint">Ao editar um item: <span class="kbd">Enter</span> cria o próximo · <span class="kbd">Tab</span> transforma em subitem · <span class="kbd">Shift+Tab</span> volta um nível · até ${MAXSUB} níveis.</div>
    <div class="sec">${rows || '<div class="empty">Lista vazia.</div>'}</div>
    ${done ? `<div style="margin-top:var(--s2)"><button class="btn ghost" data-act="li-clear">Limpar concluídos</button></div>` : ''}
    <div class="sec"><div class="sec-h"><h2>Notas</h2></div><textarea class="notes autosize dotgrid" id="lnotes" placeholder="Anotações desta lista…">${esc(l.notes)}</textarea></div>
  </div>`;
};

/* ---------------- Relatórios em PDF ---------------- */
function rpHeader(title, sub){
  const P = S.profile, f = P.pdf || {};
  const info = [P.cargo && esc(P.cargo), P.setor && esc(P.setor) + (P.unidade ? ' · ' + esc(P.unidade) : ''), !P.setor && P.unidade && esc(P.unidade), f.mat && P.matricula && 'Matrícula ' + esc(P.matricula), f.reg && P.registro && esc(P.registro), f.email && P.email && esc(P.email), f.tel && P.telefone && esc(P.telefone)].filter(Boolean);
  return `<div class="rp-h"><div class="rp-logo">${S.settings.logo ? `<img src="${S.settings.logo}" alt="">` : ICON_SVG}</div><div><div class="rp-k">Agenda Inicial · uso pessoal</div><h1>${esc(title)}</h1><div class="rp-s">${sub}</div></div></div><div class="rp-p"><b>${esc(P.name)}</b>${info.map(x => `<span>${x}</span>`).join('')}</div>`;
}
function rpFoot(){
  const P = S.profile, now = new Date();
  return `${P.pdf && P.pdf.sign ? `<div class="sign"><b>${esc(P.name)}</b><br>${esc([P.cargo, P.matricula && 'Matrícula ' + P.matricula].filter(Boolean).join(' · '))}</div>` : ''}<div class="foot">Emitido em ${brDate(ymd(now))} às ${pad(now.getHours())}:${pad(now.getMinutes())} · Agenda Inicial, ferramenta de uso pessoal, sem caráter oficial.</div>`;
}
function rpEntry(e, d = 0){
  const p = progressOf(e);
  let h = `<li class="${e.status}" style="--d:${d}"><span class="b">${bulletOf(e)}</span><span class="x">${e.prio ? '<b>*</b> ' : ''}${e.time ? `<span class="t">${e.time}${e.end ? '–' + e.end : ''}</span>` : ''}${esc(e.text)}</span><span class="m">${(e.status === 'migrated' || e.status === 'scheduled') && e.to ? '→ ' + shortDate(e.to) : ''}${p ? ` ${p.done}/${p.total}` : ''}</span></li>`;
  const fs = filesOf(e.id);
  if (fs.length) h += `<li style="--d:${d}"><span class="b"></span><span class="x" style="font-size:8.5pt;color:#555">Anexos: ${fs.map(f => esc(f.name)).join(' · ')}</span><span class="m"></span></li>`;
  for (const k of kids(e.id)) h += rpEntry(k, d + 1);
  return h;
}
function rpItems(d){
  const es = entriesOn(d), gs = gEvents(d);
  if (!es.length && !gs.length) return '';
  return `<ul>${es.map(e => rpEntry(e)).join('')}${gs.map(g => `<li><span class="b">○</span><span class="x">${g.start ? `<span class="t">${g.start}–${g.end}</span>` : ''}${esc(g.title)}</span><span class="m">Google</span></li>`).join('')}</ul>`;
}
function rpStats(a, b){
  const list = S.entries.filter(e => e.date && e.date >= a && e.date <= b && !['migrated','scheduled'].includes(e.status));
  const t = list.filter(e => e.type === 'task'), dn = t.filter(e => e.status === 'done').length, op = t.filter(e => e.status === 'open').length;
  let ev = list.filter(e => e.type === 'event').length;
  for (let d = a; d <= b; d = addDays(d, 1)) ev += gEvents(d).length;
  return `<div class="sum"><div><b>${t.length}</b>tarefas e subtarefas</div><div><b>${dn}</b>concluídas</div><div><b>${op}</b>em aberto</div><div><b>${ev}</b>compromissos</div></div>`;
}
function rpBullets(){ return '<p style="font-size:8pt;color:#777;margin:10px 0 0">• tarefa · × concluída · ○ compromisso · – nota · &gt; migrada · &lt; agendada · * prioridade</p>'; }
function doPrint(html, name){
  const pr = $('#print'); pr.innerHTML = `<div class="rp">${html}</div>`;
  document.body.classList.add('printing'); const old = document.title; document.title = name;
  const fin = () => { document.body.classList.remove('printing'); document.title = old; pr.innerHTML = ''; window.removeEventListener('afterprint', fin); };

}
const fileBase = () => S.profile.name ? ' - ' + S.profile.name : '';
async function exportDay(d){

async function exportPeriod(a, b, withNotes){

function fileTable(files, compact){

/* ---------------- Versões ---------------- */
const UP = { notes: null, checked: 0, error: '', newer: null };
const verNum = v => String(v || '0').split('.').map(n => parseInt(n, 10) || 0).reduce((a, n) => a * 1000 + n, 0);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: window-controls-overlay)').matches;
async function checkUpdate(manual){
  if (!/^https?:$/.test(location.protocol)) return;
  try {
    const r = await fetch('versao.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('versão indisponível');
    const m = await r.json(); UP.checked = Date.now(); UP.error = '';
    if (m.version === APP_RELEASE) UP.notes = m.notes || [];
    UP.newer = verNum(m.version) > verNum(APP_RELEASE) ? m : null;
    if (UP.newer){ const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); }
    if (manual) toast(UP.newer ? `Versão ${m.version} disponível. Recarregando…` : `Você está na versão mais recente (${APP_RELEASE}).`);
    if (UP.newer && manual) setTimeout(() => location.reload(), 800);
    if (S.settings.notesSeen !== APP_RELEASE && UP.notes){ const had = !!S.settings.notesSeen || S.entries.length > 0; S.settings.notesSeen = APP_RELEASE; save(false); if (had) toast(`Agenda atualizada para a versão ${APP_RELEASE}. Veja as novidades em Configurações.`, 5000); }
  } catch(e){ UP.error = e.message; if (manual) toast('Sem conexão para verificar agora.'); }
  renderSide(); if (ui.view === 'config') render(false);
}

async function showViewer(){
  vCleanup();
  const item = V.list[V.i], kind = kindOf(item.name), tok = ++V.token;
  const body = $('#vbody'), tabs = $('#vtabs');
  body.className = 'vbody'; tabs.innerHTML = ''; V.zoom = 1;
  vBar(item, ['docx','sheet','pptx','image','text'].includes(kind) ? zoomTools() : '');
  body.innerHTML = '<div class="vload">Carregando…</div>';
  let file;
  try { file = await fileOf(item); } catch(e){ if (tok === V.token) vMsg('Não consegui abrir o arquivo', esc(e.message), item); return; }
  if (tok !== V.token) return;
  V.file = file;
  const ext = extOf(item.name);
  try {
    if (kind === 'pdf'){
      body.classList.add('flush');
      V.url = URL.createObjectURL(new Blob([file], { type: 'application/pdf' }));
      body.innerHTML = `<iframe src="${V.url}#view=FitH" title="${esc(item.name)}"></iframe>`;
    }
    else if (kind === 'image'){
      V.url = URL.createObjectURL(new Blob([file], { type: MIME[ext] || file.type }));
      body.innerHTML = `<div class="vimg vzoom"><img src="${V.url}" alt="${esc(item.name)}" data-act="v-imgfull" title="Clique para ver em tamanho real"></div>`;
    }
    else if (kind === 'audio' || kind === 'video'){
      V.url = URL.createObjectURL(new Blob([file], { type: MIME[ext] || file.type }));
      body.innerHTML = `<div class="vmedia">${kind === 'video' ? `<video src="${V.url}" controls autoplay></video>` : `<audio src="${V.url}" controls autoplay></audio>`}</div>`;
    }
    else if (kind === 'text'){
      let t = await file.text();
      if (ext === 'html' || ext === 'htm'){
        body.classList.add('flush');
        V.url = URL.createObjectURL(new Blob([t], { type: 'text/html' }));
        body.innerHTML = `<iframe sandbox="" src="${V.url}" title="${esc(item.name)}"></iframe>`;
      } else {
        if (ext === 'json'){ try { t = JSON.stringify(JSON.parse(t), null, 2); } catch(e){} }
        if (t.length > 2e6) t = t.slice(0, 2e6) + '\n\n[… arquivo muito grande, exibidos os primeiros 2 MB]';
        body.innerHTML = `<pre class="vtext vzoom">${esc(t)}</pre>`;
      }
    }
    else if (kind === 'docx'){
      await lib('jszip'); await lib('docx');
      if (tok !== V.token) return;
      body.innerHTML = '<div class="vdocx vzoom"><div id="vdoc"></div></div>';
      await window.docx.renderAsync(await file.arrayBuffer(), $('#vdoc'), null, { className: 'docx', inWrapper: true, breakPages: true, renderHeaders: true, renderFooters: true, renderFootnotes: true, renderEndnotes: true, useBase64URL: true, experimental: true });
    }
    else if (kind === 'sheet'){
      await lib('xlsx');
      if (tok !== V.token) return;
      const data = ext === 'csv' || ext === 'tsv' ? await file.text() : await file.arrayBuffer();
      const wb = window.XLSX.read(data, { type: typeof data === 'string' ? 'string' : 'array', cellDates: true, dense: false, FS: ext === 'tsv' ? '\t' : undefined });
      V.wb = wb; V.sheet = 0;
      tabs.innerHTML = wb.SheetNames.map((n, i) => `<button data-act="v-sheet" data-i="${i}" class="${i ? '' : 'on'}">${esc(n)}</button>`).join('');
      renderSheet();
    }
    else if (kind === 'pptx'){
      await lib('jszip'); await lib('pptx');
      if (tok !== V.token) return;
      const buf = await file.arrayBuffer();
      let ratio = 9 / 16;
      try { const zx = await window.JSZip.loadAsync(buf); const px = await zx.file('ppt/presentation.xml').async('string'); const m = px.match(/<p:sldSz[^>]*cx="(\d+)"[^>]*cy="(\d+)"/); if (m) ratio = +m[2] / +m[1]; } catch(e){}
      const w = Math.min(1100, body.clientWidth - 64);
      body.innerHTML = '<div class="vpptx vzoom"><div id="vppt"></div></div>';
      const pv = window.pptxPreview.init($('#vppt'), { width: w, height: Math.round(w * ratio), mode: 'list' });
      V.cleanup = () => pv.destroy && pv.destroy();
      await pv.preview(buf);
    }
    else if (['doc','ppt','pps','odt','odp','rtf','msg','pub','vsd','vsdx'].includes(ext)){
      vMsg('Este formato não tem visualização dentro da agenda', 'Arquivos .' + esc(ext) + ' abrem melhor no aplicativo de origem.', item);
    }
    else vMsg('Formato sem visualização', 'Não há visualizador para arquivos .' + esc(ext || '?') + '. Você pode abri-lo no aplicativo do computador.', item);
  } catch(e){
    console.warn(e);
    if (tok === V.token) vMsg('Não consegui exibir este arquivo', esc(e.message || 'O arquivo pode estar corrompido ou protegido por senha.'), item);
  }
}
function renderSheet(){
  const X = window.XLSX, ws = V.wb.Sheets[V.wb.SheetNames[V.sheet]];
  $$('#vtabs button').forEach((b, i) => b.classList.toggle('on', i === V.sheet));
  if (!ws || !ws['!ref']){ $('#vbody').innerHTML = '<div class="vmsg"><div><b>Planilha vazia</b></div></div>'; return; }
  const r = X.utils.decode_range(ws['!ref']); const MAXR = 3000, MAXC = 200;
  const r2 = Math.min(r.e.r, r.s.r + MAXR - 1), c2 = Math.min(r.e.c, r.s.c + MAXC - 1);
  const skip = new Set(), span = {};
  for (const m of ws['!merges'] || []){
    span[m.s.r + ',' + m.s.c] = [m.e.r - m.s.r + 1, m.e.c - m.s.c + 1];
    for (let R = m.s.r; R <= m.e.r; R++) for (let C = m.s.c; C <= m.e.c; C++) if (R !== m.s.r || C !== m.s.c) skip.add(R + ',' + C);
  }
  const cols = ws['!cols'] || [];
  let h = '<table><thead><tr><th></th>';
  for (let C = r.s.c; C <= c2; C++) h += `<th style="min-width:${Math.max(48, Math.min(360, ((cols[C] && (cols[C].wpx || (cols[C].wch || 0) * 7)) || 72)))}px">${X.utils.encode_col(C)}</th>`;
  h += '</tr></thead><tbody>';
  for (let R = r.s.r; R <= r2; R++){
    h += `<tr><th>${R + 1}</th>`;
    for (let C = r.s.c; C <= c2; C++){
      const k = R + ',' + C; if (skip.has(k)) continue;
      const cell = ws[X.utils.encode_cell({ r: R, c: C })];
      const sp = span[k] ? ` rowspan="${span[k][0]}" colspan="${span[k][1]}"` : '';
      let txt = '', cls = '';
      if (cell){
        if (cell.f && (cell.v === undefined || cell.v === '')){ txt = '=' + cell.f; cls = 'f'; }
        else if (cell.w !== undefined) txt = cell.w;
        else if (cell.v instanceof Date) txt = cell.v.toLocaleDateString('pt-BR');
        else if (cell.v !== undefined) txt = String(cell.v);
        else if (cell.f){ txt = '=' + cell.f; cls = 'f'; }
        if (cell.t === 'n' && !cls) cls = 'n';
      }
      h += `<td class="${cls}"${sp} title="${esc(cell && cell.f ? '=' + cell.f : txt)}">${esc(txt)}</td>`;
    }
    h += '</tr>';
  }
  h += '</tbody></table>';
  if (r.e.r > r2 || r.e.c > c2) h += `<div class="more">Exibindo as primeiras ${r2 - r.s.r + 1} linhas e ${c2 - r.s.c + 1} colunas. Para ver tudo, abra no Excel.</div>`;
  $('#vbody').innerHTML = `<div class="vsheet vzoom">${h}</div>`;
  applyZoom();
}

function pickDate(cb, initial, ev){
  const dp = $('#dp'); dp.value = initial || '';
  if (ev){ dp.style.left = ev.clientX + 'px'; dp.style.top = ev.clientY + 'px'; }
  dp.onchange = () => { if (dp.value) cb(dp.value); dp.onchange = null; };
  try { dp.showPicker(); } catch(e){ const v = prompt('Data (AAAA-MM-DD):', initial || today()); if (v && /^\d{4}-\d{2}-\d{2}$/.test(v)) cb(v); }
}
function nextBusiness(s){ let d = addDays(s, 1); while (!isBusiness(d)) d = addDays(d, 1); return d; }

function quickAdd(){
  const inp = $('#qtext'); if (!inp) return;
  const raw = inp.value; if (!raw.trim()) return;
  const q = parseQuick(raw);
  const type = q.type || ui.qtype, time = q.time || $('#qtime').value || '';
  const e = addEntry({ type, text: q.text, date: ui.date, time, prio: q.prio || ui.qprio });
  inp.value = ''; $('#qtime').value = ''; ui.qprio = false;
  const push = $('#qg') && $('#qg').checked && type === 'event';
  save();
  if (push) gPush(e);
  setTimeout(() => $('#qtext') && $('#qtext').focus(), 0);
}

  'e-gpush': a => { const e = byId(a.closest('.entry').dataset.id); gPush(e); },
  'e-del': a => { const e = byId(a.closest('.entry').dataset.id); if (!e) return; if (deleteEntry(e)) save(); },
  'e-edit': (a, ev) => {
    if (ev.target.closest('[data-act="e-time"]')) return ACT['e-time'](a);
    const li = a.closest('.entry'), e = byId(li.dataset.id); if (!e) return;
    const t = $('.t', li); if (t.isContentEditable) return;
    t.contentEditable = 'true'; a.setAttribute('contenteditable', 'false'); t.focus();
    const r = document.createRange(); r.selectNodeContents(t); r.collapse(false); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    const fin = keep => { t.contentEditable = 'false'; const v = t.textContent.trim(); if (keep && v && v !== e.text){ e.text = v; save(); if (e.gId) gPush(e, true); } else render(false); };
    t.onkeydown = k => {
      if (k.key === 'Enter'){ k.preventDefault(); t.onblur = null; fin(true); }
      if (k.key === 'Escape'){ t.onblur = null; fin(false); }
      if (k.key === 'Tab'){ k.preventDefault(); t.onblur = null; const v = t.textContent.trim(); if (v) e.text = v; if (!indentEntry(e, k.shiftKey ? -1 : 1)) fin(true); }
    };
    t.onblur = () => { if (!ui.rendering) fin(true); };
  }
};
document.addEventListener('click', ev => {
  if (ev.target.id === 'viewer'){ closeViewer(); return; }
  const a = ev.target.closest('[data-act]'); if (!a) return;
  const fn = ACT[a.dataset.act]; if (!fn) return;
  if (a.tagName === 'A' && a.getAttribute('href') === '#') ev.preventDefault();
  if (a.tagName === 'INPUT' && a.type === 'checkbox'){ fn(a, ev); return; }
  fn(a, ev);
});
document.addEventListener('keydown', ev => {
  const t = ev.target;
  if (!$('#viewer').hidden){
    if (ev.key === 'Escape'){ ev.preventDefault(); closeViewer(); return; }
    if (ev.key === 'ArrowLeft' && V.list.length > 1 && t.tagName !== 'INPUT'){ ev.preventDefault(); ACT['v-prev'](); return; }
    if (ev.key === 'ArrowRight' && V.list.length > 1 && t.tagName !== 'INPUT'){ ev.preventDefault(); ACT['v-next'](); return; }
    if ((ev.key === '+' || ev.key === '=') && !ev.ctrlKey){ ev.preventDefault(); ACT['v-zin'](); return; }
    if (ev.key === '-' && !ev.ctrlKey){ ev.preventDefault(); ACT['v-zout'](); return; }
    return;
  }
  if (t.id === 'qtext' && ev.key === 'Enter'){ ev.preventDefault(); quickAdd(); }
  if (t.id === 'litext' && ev.key === 'Enter'){ ev.preventDefault(); ACT['li-add'](); }
  if (t.dataset && t.dataset.fadd && ev.key === 'Enter'){
    ev.preventDefault(); const mk = t.dataset.fadd; const raw = t.value.trim(); if (!raw) return;
    const day = $(`[data-fday="${mk}"]`).value; const q = parseQuick(raw);
    const date = day ? `${mk}-${pad(+day)}` : null;
    addEntry({ type: q.type || (date ? 'event' : 'task'), text: q.text, date, month: mk, time: q.time, prio: q.prio });
    save(); setTimeout(() => { const n = $(`[data-fadd="${mk}"]`); n && n.focus(); }, 0);
  }
  if (t.id === 'subtext'){
    if (ev.key === 'Escape' || (ev.key === 'Enter' && !t.value.trim())){ ev.preventDefault(); ui.subFor = null; render(false); return; }
    if (ev.key === 'Enter'){ ev.preventDefault(); const q = parseQuick(t.value); addEntry({ type: 'task', text: q.text, parent: t.dataset.parent, prio: q.prio }); ui.focusSub = true; save(); return; }
  }
  if (t.hasAttribute && t.hasAttribute('data-li-edit') && ['Enter','Tab','Backspace'].includes(ev.key)){
    const items = curList().items, idx = items.findIndex(x => x.id === t.closest('.check').dataset.iid), it = items[idx]; if (!it) return;
    const v = t.textContent.trim();
    if (ev.key === 'Enter'){ ev.preventDefault(); if (!v){ t.blur(); return; } it.text = v; const n = { id: uid(), text: '', done: false, level: it.level || 0 }; items.splice(listRange(items, idx), 0, n); ui.focusItem = n.id; save(); }
    else if (ev.key === 'Tab'){
      ev.preventDefault(); if (v) it.text = v;
      const end = listRange(items, idx), block = items.slice(idx, end), lv = it.level || 0;
      if (ev.shiftKey){ if (!lv) return; block.forEach(x => x.level--); }
      else { const prev = items[idx - 1]; if (lv >= MAXSUB) return toast(`O limite é de ${MAXSUB} níveis.`); if (!prev) return toast('Não há item acima para servir de principal.'); if (lv > (prev.level || 0)) return toast('Este item já está um nível abaixo do item de cima.'); if (Math.max(...block.map(x => x.level || 0)) + 1 > MAXSUB) return toast(`O limite é de ${MAXSUB} níveis.`); block.forEach(x => x.level = (x.level || 0) + 1); }
      ui.focusItem = it.id; save();
    }
    else if (ev.key === 'Backspace' && !v && listRange(items, idx) === idx + 1){ ev.preventDefault(); const prev = items[idx - 1]; items.splice(idx, 1); if (prev) ui.focusItem = prev.id; save(); }
  }
  if (!['INPUT','TEXTAREA','SELECT'].includes(t.tagName) && !t.isContentEditable && !ev.ctrlKey && !ev.metaKey && !ev.altKey){
    if (ev.key === 'n' && ui.view === 'hoje'){ ev.preventDefault(); $('#qtext').focus(); }
    if (ev.key === 'ArrowLeft' && ui.view === 'hoje') ACT['day-prev']();
    if (ev.key === 'ArrowRight' && ui.view === 'hoje') ACT['day-next']();
    if (ev.key === 't'){ ui.date = today(); go('hoje'); }
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'daynotes'){ autosize(t); (S.days[ui.date] = S.days[ui.date] || {}).notes = t.value; if (!t.value) delete S.days[ui.date]; save(false); }
  if (t.id === 'lnotes'){ autosize(t); S.lists.find(x => x.id === ui.listId).notes = t.value; save(false); }
  if (t.id === 'ltitle'){ S.lists.find(x => x.id === ui.listId).title = t.value; save(false); renderSide(); }
  if (t.dataset && t.dataset.prof){ S.profile[t.dataset.prof] = t.value; save(false); renderSide(); refreshProfilePreview(); }
  if (t.id === 'fq'){ ui.fq = t.value; const pos = t.selectionStart; render(false); const n = $('#fq'); n.focus(); n.setSelectionRange(pos, pos); }
  if (t.id === 'win-path'){ S.settings.winPath = t.value.trim(); save(false); }
  if (t.id === 'g-cal'){ S.google.calName = t.value.trim() || 'Cagece'; save(false); }
  if (t.id === 'ponto-url'){ S.ponto.url = t.value.trim(); save(false); }
});
function refreshProfilePreview(){
  const P = S.profile, pv = $('#rp-prev'); if (!pv) return;
  pv.innerHTML = rpHeader('Registro do dia', `${longDate(today())} de ${today().slice(0,4)}`);
  $('#pf-av').textContent = initials(P.name); $('#pf-name').textContent = P.name || 'Seu nome';
  $('#pf-line').textContent = [P.cargo, P.setor, P.unidade].filter(Boolean).join(' · ') || 'Complete o perfil abaixo';
}
document.addEventListener('focusout', ev => {
  const t = ev.target;
  if (ui.rendering) return;
  if (t.hasAttribute && t.hasAttribute('data-li-edit')){
    const l = curList(); if (!l) return; const idx = l.items.findIndex(x => x.id === t.closest('.check').dataset.iid); const it = l.items[idx]; if (!it) return;
    const v = t.textContent.trim();
    if (!v && listRange(l.items, idx) === idx + 1){ l.items.splice(idx, 1); normLevels(l.items); setTimeout(() => save(), 0); }
    else if (v !== it.text){ it.text = v; save(false); }
  }
});
document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.id === 'fpick'){ await uploadFiles(t.files, t.dataset.link || '', t.dataset.entry || ''); t.value = ''; }
  if (t.dataset && t.dataset.fentry !== undefined){ const f = S.files.find(x => x.id === t.closest('tr').dataset.fid); if (f){ f.entry = t.value; if (t.value){ const e = byId(t.value); if (e && e.date) f.link = e.date; } save(); toast(t.value ? 'Anexo vinculado à tarefa.' : 'Vínculo com a tarefa removido.'); } }
  if (t.id === 'fpick1' && t.files[0]){
    try { const r = await storeFile(t.files[0], 'arquivos/Ponto'); S.files.push({ id: uid(), name: r.name, path: r.path, size: r.size, date: today(), addedAt: Date.now(), link: '' }); S.ponto.file = { name: r.name, path: r.path }; S.ponto.kind = 'file'; save(); toast('Arquivo do ponto vinculado.'); } catch(e){ if (e.message !== 'sem pasta') toast('Não consegui gravar o arquivo.'); }
    t.value = '';
  }
  if (t.id === 'ponto-from' && t.value){ const f = S.files.find(x => x.id === t.value); S.ponto.file = { name: f.name, path: f.path }; save(); toast('Arquivo do ponto vinculado.'); }
  if (t.id === 'ponto-copy'){ S.ponto.monthlyCopy = t.checked; save(); }
  if (t.id === 'g-push'){ S.google.pushDefault = t.checked; save(false); }
  if (t.id === 'city-hol'){ S.settings.cityHolidays = t.checked; resetHolidayCache(); save(); }
  if (t.dataset && t.dataset.pdf){ S.profile.pdf[t.dataset.pdf] = t.checked; save(false); refreshProfilePreview(); }
  if (t.id === 'logopick' && t.files[0]){
    const f = t.files[0];
    const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });
    S.settings.logo = data; const im = new Image(); im.onload = () => { S.settings.logoWide = im.width / im.height > 1.6; save(); }; im.src = data;
    if (FS.state === 'granted'){ try { const d = await dirAt('assets'); const fh = await d.getFileHandle('logo-cagece.' + (extOf(f.name) || 'png'), { create: true }); const w = await fh.createWritable(); await w.write(f); await w.close(); } catch(e){} }
    t.value = '';
  }
  if (t.id === 'vpick' && t.files[0]){ const f = t.files[0]; openViewer([{ name: f.name, file: f }], 0); t.value = ''; }
  if (t.id === 'importpick' && t.files[0]){
    try { const d = JSON.parse(await t.files[0].text()); if (!d.entries) throw 0; if (!confirm('Substituir os dados atuais pelos do arquivo importado?')) return; S = migrate(d); resetHolidayCache(); save(); toast('Cópia importada.'); } catch(e){ toast('Arquivo inválido.'); }
    t.value = '';
  }
});
// Arrastar e soltar arquivos
document.addEventListener('dragover', ev => { const d = ev.target.closest && ev.target.closest('#drop'); if (d){ ev.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', ev => { const d = ev.target.closest && ev.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', ev => { const d = ev.target.closest && ev.target.closest('#drop'); if (d){ ev.preventDefault(); d.classList.remove('over'); uploadFiles(ev.dataTransfer.files); } });
$('#main').addEventListener('scroll', () => { const tb = $('.topbar'); tb && tb.classList.toggle('scrolled', $('#main').scrollTop > 4); });
window.addEventListener('storage', ev => { if (ev.key === LS_KEY && ev.newValue){ S = migrate(JSON.parse(ev.newValue)); render(false); } });
// Virada do dia com a agenda aberta
setInterval(() => { if (ui._today !== today()){ const was = ui._today; ui._today = today(); if (was && ui.view === 'hoje' && ui.date === was){ ui.date = today(); } render(); } }, 60000);

/* ---------------- Início ---------------- */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window._bip = e; renderSide(); if (ui.view === 'config') render(false); });
window.addEventListener('appinstalled', () => { window._bip = null; renderSide(); toast('Agenda Inicial instalada. Ela agora abre como aplicativo, com ícone próprio.', 5000); });
if (/^https?:$/.test(location.protocol) && 'serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded && UP.newer){ reloaded = true; location.reload(); } });
}
(async function start(){
  ui._today = today();
  { const h = location.hash.slice(1); if (['hoje','cal','futuro','arquivos','ponto','perfil','config'].includes(h)) ui.view = h; }
  applyTheme();
  render(false);
  await initFS();
  render();
  if (pontoInfo().pending) document.title = '• Ponto pendente · Agenda Cagece';
  setTimeout(() => checkUpdate(), 1500);
  setInterval(() => checkUpdate(), 6 * 3600 * 1000);
})();
</script>
