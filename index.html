function descricaoDoNome(nome){
  let base = String(nome).replace(/\.[A-Za-z0-9]{1,8}$/, '');
  const c = tiLerCarimbo(base); if (c) base = c.resto;
  const d = tiLerDoc(base); if (d) base = d.descricao;
  base = base.replace(/^(IMG|VID|PXL|DSC|WA|Screenshot|Captura de tela)[-_ ]?[\d_ .-]*(WA\d+)?/i, '').replace(/[_]+/g, ' ').replace(/\s+/g, ' ').trim();
  return base.slice(0, 80);
}
/** O que o arquivo parece ser (classificarArquivo do Termo Inicial): devolve só a descrição. */
function classificarArquivo(nome){
  const ext = extOf(nome), n = simplesTxt(nome.replace(/[_.-]+/g, ' ')), desc = descricaoDoNome(nome);
  if (/contrato/.test(n) && /honorario|prestacao de servico|advocaticio/.test(n)) return 'Contrato de honorários';
  if (/procuracao|substabelecimento|hipossuficiencia|declaracao de pobreza|justica gratuita/.test(n)) return /substabelec/.test(n) ? 'Substabelecimento' : /procura/.test(n) ? 'Procuração' : 'Declaração de hipossuficiência';
  if (/protocolo|recibo de (envio|protocolo)|comprovante de (envio|peticionamento)/.test(n)) return desc || 'Protocolo';
  const pet = TI_PETICOES.find(([r]) => r.test(n)); if (pet && (TI_TEXTO.has(ext) || ext === 'pdf')) return pet[1];
  if (/\bautos\b|integra|copia do processo/.test(n) || (TI_CNJ.test(nome) && ext === 'pdf')) return 'Autos do processo';
  const pes = TI_PESSOAIS.find(([r]) => r.test(n)); if (pes) return pes[1];
  if (TI_PROVAS.test(n) || TI_IMAGEM.has(ext) || TI_MIDIA.has(ext)) return desc || '';
  return desc || '';
}
/* Aprendizado: a "assinatura" é o nome limpo com os números trocados por #; só nomes com palavra de verdade viram regra. */
const tiAssinatura = nome => { const d = simplesTxt(descricaoDoNome(nome)).replace(/\d+/g, '#').replace(/[^a-z#]+/g, ' ').trim(); return /[a-z]{3}/.test(d) ? d : ''; };
const tiPalavras = nome => new Set(simplesTxt(descricaoDoNome(nome)).split(/[^a-z]+/).filter(w => w.length >= 3));
function sugerirTitulo(nome){
  const regras = S.settings.titulos || [], a = tiAssinatura(nome);
  if (a){
    const exata = regras.find(r => r.a === a); if (exata) return { titulo: exata.t, fonte: 'aprendido' };
    const p = tiPalavras(nome); let melhor = null, nota = 0;
    for (const r of regras){ const q = new Set(r.a.split(' ').filter(w => w.length >= 3 && w !== '#')); const inter = [...p].filter(w => q.has(w)).length, uni = new Set([...p, ...q]).size; const j = uni ? inter / uni : 0; if (j > nota){ nota = j; melhor = r; } }
    if (melhor && nota >= 0.6) return { titulo: melhor.t, fonte: 'aprendido' };
  }
  const c = classificarArquivo(nome);
  if (c) return { titulo: c.charAt(0).toUpperCase() + c.slice(1), fonte: 'regra' };
  return { titulo: '', fonte: '' };
}
function aprenderTitulo(nome, titulo){
  const a = tiAssinatura(nome); if (!a || !titulo) return;
  const regras = (S.settings.titulos || []).filter(r => r.a !== a);
  regras.unshift({ a, t: titulo, em: Date.now() });
  S.settings.titulos = regras.slice(0, 300);
}
const tituloDe = f => f.kind === 'caderno' ? f.title : (f.title || f.name);
function definirTitulo(f){
  const sug = f.title || sugerirTitulo(f.name).titulo || descricaoDoNome(f.name);
  const v = prompt(`Título de “${f.name}”.\nO arquivo continua com o mesmo nome na pasta; a agenda passa a mostrar este título e aprende com ele.`, sug);
  if (v === null) return;
  const t = v.trim().slice(0, 120);
  if (!t || t === f.name){ delete f.title; delete f.tituloFonte; }
  else { f.title = t; f.tituloFonte = 'voce'; aprenderTitulo(f.name, t); }
  f.updatedAt = Date.now(); save();
}

/* ---------------- Leitor com marcações ----------------
   Tradução do leitor do Termo Inicial (VisualizadorPdf, BarraMarcar e lib/anotacoes): mesmos tipos, cores e formato
   (retângulos em fração da página), para as marcações passarem de um app para o outro quando os dois se unirem.
   Vale para PDF (pdf.js 4.10.38, o mesmo do Termo Inicial) e para documentos do Word (cada página é uma seção). */
const TIPOS_ANOTACAO = ['destaque', 'sublinhado', 'tachado', 'comentario', 'marcador'];
const CORES_ANOTACAO = ['amarelo', 'verde', 'azul', 'rosa', 'laranja'];
const NOME_TIPO_MARCA = { destaque: 'Destaque', sublinhado: 'Sublinhado', tachado: 'Tachado', comentario: 'Comentário', marcador: 'Página marcada' };
const NOME_COR = { amarelo: 'Amarelo', verde: 'Verde', azul: 'Azul', rosa: 'Rosa', laranja: 'Laranja' };
function juntarRetangulos(rs){
  const ordenados = [...rs].filter(r => r[2] > 0.001 && r[3] > 0.001).sort((a, b) => a[1] - b[1] || a[0] - b[0]);
  const saida = [];
  for (const r of ordenados){
    const u = saida[saida.length - 1];
    const mesmaLinha = u && Math.abs(u[1] - r[1]) < Math.min(u[3], r[3]) * 0.5;
    if (mesmaLinha && r[0] <= u[0] + u[2] + 0.02){
      const x = Math.min(u[0], r[0]), y = Math.min(u[1], r[1]), fx = Math.max(u[0] + u[2], r[0] + r[2]), fy = Math.max(u[1] + u[3], r[1] + r[3]);
      saida[saida.length - 1] = [x, y, fx - x, fy - y];
    } else saida.push([...r]);
  }
  return saida.map(r => r.map(v => Math.round(Math.min(1, Math.max(0, v)) * 10000) / 10000));
}
let PDFJS = null;
async function pdfjs(){
  if (!PDFJS){ PDFJS = await import(new URL('assets/lib/pdfjs/pdf.min.mjs', location.href).href); PDFJS.GlobalWorkerOptions.workerSrc = new URL('assets/lib/pdfjs/pdf.worker.min.mjs', location.href).href; }
  return PDFJS;
}
const MK = { item: null, sel: null, cor: (() => { try { return localStorage.getItem('agendaInicial.cor') || 'amarelo'; } catch(e){ return 'amarelo'; } })() };
const marcasDe = f => (f && f.marcas) || [];
function desenharMarcas(pg){
  if (!MK.item) return;
  const n = +pg.dataset.pagina, ms = marcasDe(MK.item).filter(m => m.pagina === n);
  pg.querySelectorAll(':scope > .marcas, :scope > .marca-fita').forEach(e => e.remove());
  const camada = document.createElement('div'); camada.className = 'marcas';
  camada.innerHTML = ms.filter(m => m.tipo !== 'marcador').flatMap(m => m.retangulos.map(r => `<span class="marca marca-${m.tipo} marca-cor-${m.cor}" style="left:${r[0] * 100}%;top:${r[1] * 100}%;width:${r[2] * 100}%;height:${r[3] * 100}%"></span>`)).join('')
    + ms.filter(m => m.comentario && m.retangulos.length).map(m => `<span class="marca-pino marca-cor-${m.cor}" style="top:${m.retangulos[0][1] * 100}%"></span>`).join('');
  pg.prepend(camada);
  const fita = ms.find(m => m.tipo === 'marcador');
  if (fita){ const f = document.createElement('span'); f.className = `marca-fita marca-cor-${fita.cor}`; f.title = 'Página marcada'; pg.appendChild(f); }
}
function redesenharTodas(){ $$('#vbody [data-pagina]').forEach(desenharMarcas); }
async function abrirPdf(item, file, body, tok){
  const lib = await pdfjs();
  const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  if (tok !== V.token){ doc.destroy(); return; }
  MK.item = item; V.pdf = doc;
  body.classList.add('flush');
  body.innerHTML = '<div class="pdfv" id="pdfv"><div class="vzoom" id="pdfpags"></div></div>';
  const area = $('#pdfv'), pags = $('#pdfpags');
  const p1 = await doc.getPage(1), b1 = p1.getViewport({ scale: 1 });
  const largura = Math.max(320, Math.min(area.clientWidth - 48, 920));
  for (let n = 1; n <= doc.numPages; n++){
    const d = document.createElement('div'); d.className = 'pdfpg'; d.dataset.pagina = n;
    d.style.width = largura + 'px'; d.style.height = Math.round(largura * b1.height / b1.width) + 'px';
    d.innerHTML = `<span class="pgn">${n}</span>`;
    pags.appendChild(d);
  }
  const feitas = new Set();
  const io = new IntersectionObserver(es => { for (const e of es) if (e.isIntersecting && !feitas.has(e.target)){ feitas.add(e.target); renderPagina(doc, e.target, largura); } }, { root: area, rootMargin: '800px 0px' });
  pags.querySelectorAll('.pdfpg').forEach(d => io.observe(d));
  V.cleanup = () => { io.disconnect(); try { doc.destroy(); } catch(e){} V.pdf = null; MK.item = null; fecharBarra(); };
  if (V.pagina){ const alvo = pags.querySelector(`[data-pagina="${V.pagina}"]`); if (alvo) setTimeout(() => alvo.scrollIntoView({ block: 'start' }), 60); V.pagina = 0; }
}
async function renderPagina(doc, el, largura){
  const lib = await pdfjs();
  const p = await doc.getPage(+el.dataset.pagina);
  const base = p.getViewport({ scale: 1 }), escala = largura / base.width, vp = p.getViewport({ scale: escala });
  el.style.height = vp.height + 'px';
  const c = document.createElement('canvas'), dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = Math.floor(vp.width * dpr); c.height = Math.floor(vp.height * dpr); c.style.width = vp.width + 'px'; c.style.height = vp.height + 'px';
  const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  el.prepend(c);
  await p.render({ canvasContext: ctx, viewport: vp }).promise.catch(() => null);
  const t = document.createElement('div'); t.className = 'textLayer'; t.style.setProperty('--scale-factor', String(escala));
  el.appendChild(t);
  await new lib.TextLayer({ textContentSource: p.streamTextContent(), container: t, viewport: vp }).render().catch(() => null);
  desenharMarcas(el);
}
/* Seleção → barra de marcar; clique numa marcação → detalhe. */
function fecharBarra(){ const b = $('#mbarra'); if (b) b.remove(); MK.sel = null; }
function posBarra(x, y){ return { left: Math.max(8, Math.min(x, innerWidth - 312)) + 'px', top: Math.max(8, Math.min(y + 8, innerHeight - 260)) + 'px' }; }
function abrirBarra(html, x, y){
  const velha = $('#mbarra'); if (velha) velha.remove();
  const b = document.createElement('div'); b.className = 'marcar-barra'; b.id = 'mbarra'; b.innerHTML = html;

  b.addEventListener('keydown', ev => ev.stopPropagation());

}
const coresHtml = (sel, act) => `<span class="marcar-cores">${CORES_ANOTACAO.map(c => `<button type="button" class="marcar-cor marca-cor-${c}" aria-checked="${sel === c}" title="${NOME_COR[c]}" data-act="${act}" data-cor="${c}"></button>`).join('')}</span>`;
function barraMarcar(){
  const sel = MK.sel; if (!sel) return;
  const b = abrirBarra(`${coresHtml(MK.cor, 'mk-cor')}
    <span class="marcar-acoes">${['destaque', 'sublinhado', 'tachado'].map(t => `<button class="btn" data-act="mk-marcar" data-tipo="${t}">${{ destaque: 'Destacar', sublinhado: 'Sublinhar', tachado: 'Tachar' }[t]}</button>`).join('')}<button class="btn" data-act="mk-comentar">Comentar</button></span>`, sel.x, sel.y);

function selecaoParaMarca(){
  const s = getSelection(), texto = s ? s.toString().trim() : '';
  if (!(s && !s.isCollapsed && texto && s.rangeCount)) return false;
  const r = s.getRangeAt(0), no = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement;
  const pg = no && no.closest('#vbody [data-pagina]'); if (!pg) return false;
  const cx = pg.getBoundingClientRect();
  const brutos = [...r.getClientRects()].filter(q => q.width > 1 && q.height > 1 && q.bottom > cx.top && q.top < cx.bottom);
  const rs = juntarRetangulos(brutos.map(q => [(q.left - cx.left) / cx.width, (q.top - cx.top) / cx.height, q.width / cx.width, q.height / cx.height]));
  if (!rs.length) return false;
  const u = brutos[brutos.length - 1];
  MK.sel = { pagina: +pg.dataset.pagina, retangulos: rs, texto: texto.slice(0, 2000), x: u.left, y: u.bottom };
  barraMarcar(); return true;
}
/* No celular a seleção termina pelas alças, sem mouseup: espera a seleção parar de mudar. */
let mkSelT = 0;
document.addEventListener('selectionchange', () => {
  if (!MK.item || !matchMedia('(pointer: coarse)').matches) return;
  clearTimeout(mkSelT); mkSelT = setTimeout(() => { if (!$('#mbarra') || MK.sel) selecaoParaMarca(); }, 600);
});
document.addEventListener('mouseup', ev => {
  if ($('#viewer').hidden || !MK.item || ev.target.closest('#mbarra')) return;
  if (!ev.target.closest('#vbody')) return;
  setTimeout(() => {
    if (selecaoParaMarca()) return;
    const s = getSelection(), texto = s ? s.toString().trim() : '';
    if (s && !s.isCollapsed && texto) return;
    fecharBarra();
    const pg = ev.target.closest('[data-pagina]'); if (!pg) return;
    const cx = pg.getBoundingClientRect(), px = (ev.clientX - cx.left) / cx.width, py = (ev.clientY - cx.top) / cx.height, n = +pg.dataset.pagina;
    const m = marcasDe(MK.item).find(k => k.pagina === n && k.retangulos.some(([x, y, w, h]) => px >= x - .004 && px <= x + w + .004 && py >= y - .006 && py <= y + h + .006));
    if (m) detalheMarca(m, ev.clientX, ev.clientY);

});

/* ---------------- Pacote Inicial · ambientes de trabalho ----------------

const setorNome = (a, id) => ((a && a.setores) || []).find(x => x.id === id)?.nome || '';
async function ambRpc(acao, dados = {}){
  if (!CLOUD.user) throw new Error('entre com o Google para usar ambientes');
  if (CLOUD.via === 'ponte') return ponte('rpc', { fn: 'agendainicial_ponte_amb', args: { p_acao: acao, p_dados: dados } });
  const sb = await cloudClient();
  const { data, error } = await sb.rpc('inicial_amb', { acao, dados });
  if (error) throw error; return data;
}
function ambAplicar(e){
  if (!e) return;
  AMB.lista = e.ambientes || []; AMB.convites = e.convites_para_mim || []; AMB.eu = e.eu || null; AMB.carregado = true;
  setTimeout(sinoAtualizar, 0);
  try { localStorage.setItem('agendaInicial.ambientes', JSON.stringify({ lista: AMB.lista, convites: AMB.convites, eu: AMB.eu })); } catch(_){}
  if (AMB_ATUAL && !AMB.lista.some(a => a.id === AMB_ATUAL)){ toast('Você não faz mais parte desse ambiente. Voltando para a agenda pessoal.', 6000); trocarAmbiente(''); return; }
  const a = ambAtual();
  if (a){ const P = S.profile, st = setorNome(a, a.setor_id); if (P.empresa !== a.nome || (P.setor || '') !== st || (a.cargo && P.cargo !== a.cargo)){ P.empresa = a.nome; P.setor = st; if (a.cargo) P.cargo = a.cargo; save(false); } }
}

async function ambPuxar(){
  if (!CLOUD.user || AMB.busy) return;
  AMB.busy = true;
  try { ambAplicar(await ambRpc('estado')); renderSide(); if (['equipe','hoje'].includes(ui.view)) renderBg(); conviteLinkVer(); }
  catch(e){ console.warn('ambientes', e); }
  finally { AMB.busy = false; }
}
async function ambAcao(acao, dados, ok){
  try { const e = await ambRpc(acao, dados); ambAplicar(e); renderSide(); render(false); if (ok) toast(ok); return e; }
  catch(e){ toast('Não foi possível: ' + (e.message || e), 6000); return null; }
}
const esperar = ms => new Promise(r => setTimeout(r, ms));
async function nuvemParada(){ for (let i = 0; i < 200 && CLOUD.busy; i++) await esperar(100); }
/* Troca a agenda da tela pela do ambiente escolhido. Com "levar", o conteúdo atual muda para o ambiente
   (a agenda de origem fica vazia, e os outros aparelhos seguem a mudança sozinhos). */
function mesclarAgendas(base, extra){
  const ids = k => new Set((base[k] || []).map(x => x.id));
  for (const k of ['entries', 'files']){ const tem = ids(k); for (const x of extra[k] || []) if (!tem.has(x.id)) base[k].push(x); }
  const tl = ids('lists');
  for (const l of extra.lists || []){
    if (tl.has(l.id)) continue;
    const mesma = base.lists.find(b => b.title === l.title && l.title === 'Lista geral');
    if (mesma){ const ti = new Set(mesma.items.map(i => i.id)); for (const i of l.items) if (!ti.has(i.id)) mesma.items.push(i); if (l.notes && !mesma.notes.includes(l.notes)) mesma.notes = [mesma.notes, l.notes].filter(Boolean).join('\n\n'); mesma.updatedAt = Date.now(); }
    else base.lists.push(l);
  }
  for (const [d, v] of Object.entries(extra.days || {})){
    const b = base.days[d];
    if (!b || !b.notes) base.days[d] = Object.assign({}, b || {}, v);
    else if (v.notes && !b.notes.includes(v.notes)) b.notes = b.notes + '\n\n' + v.notes;
  }
  for (const [m, t] of Object.entries((extra.ponto && extra.ponto.done) || {})) if (!base.ponto.done[m]) base.ponto.done[m] = t;
  return base;
}
async function trocarAmbiente(id, levar = false){
  if (id === AMB_ATUAL) return;
  if (ui.view === 'caderno' && NB.dirty) nbSave();
  clearTimeout(saveTimer); await writeDisk(); await nuvemParada();
  const origem = AMB_ATUAL, atual = S;
  if (levar){
    const vazio = DEFAULT();
    vazio.profile = JSON.parse(JSON.stringify(atual.profile)); vazio.settings = Object.assign({}, atual.settings, { movidoPara: id });
    vazio.google = JSON.parse(JSON.stringify(atual.google)); vazio.updatedAt = Date.now();
    S = migrate(vazio); try { localStorage.setItem(lsKey(), JSON.stringify(S)); } catch(e){} await writeDisk();
    if (CLOUD.user){ await cloudSync(); await nuvemParada(); }          // a origem envia as exclusões e o aviso de mudança
  }
  AMB_ATUAL = id; try { localStorage.setItem(AMB_KEY, id); } catch(e){}
  SYNC = lerSync();
  if (levar){
    /* Se o ambiente já tem agenda neste aparelho, junta as duas (nada do ambiente é perdido). */
    const ja = localStorage.getItem(lsKey());
    S = ja ? mesclarAgendas(load(), atual) : atual;
    delete S.settings.movidoPara; S.updatedAt = Date.now(); try { localStorage.setItem(lsKey(), JSON.stringify(S)); } catch(e){}
  }
  else {
    S = load();
    if (!origem && id){ const novo = !localStorage.getItem(lsKey()) ; if (novo){ S.profile = JSON.parse(JSON.stringify(atual.profile)); const keep = {}; for (const k of [...DEVICE_SETTINGS, 'theme', 'logo', 'logoWide']) if (atual.settings[k] !== undefined) keep[k] = atual.settings[k]; Object.assign(S.settings, keep); } }
  }
  if (id) ambAplicar({ ambientes: AMB.lista, convites_para_mim: AMB.convites, eu: AMB.eu });
  else if (S.profile.empresa && AMB.lista.some(a => a.nome === S.profile.empresa) && origem){ /* volta ao pessoal: mantém o que estava */ }
  try { localStorage.setItem(lsKey(), JSON.stringify(S)); } catch(e){}
  ui.view = ['equipe'].includes(ui.view) && !id ? 'hoje' : ui.view; ui.date = today();
  if (FS.state === 'granted') await syncFromDisk();
  render(); closeMenu();
  if (CLOUD.user) cloudSync(true);
  const a = ambAtual(); toast(id ? `Ambiente ${a ? a.nome : ''}` : 'Agenda pessoal');
}
/* Quando outro aparelho levou a agenda pessoal para um ambiente, este segue junto (uma vez). */
async function ambSeguirMudanca(){
  const para = !AMB_ATUAL && S.settings.movidoPara;
  if (!para) return;
  let visto = ''; try { visto = localStorage.getItem('agendaInicial.movidoVisto') || ''; } catch(e){}
  if (visto === para) return;
  if (!AMB.lista.some(a => a.id === para)){ try { ambAplicar(await ambRpc('estado')); } catch(e){ return; } }
  if (!AMB.lista.some(a => a.id === para)) return;
  try { localStorage.setItem('agendaInicial.movidoVisto', para); } catch(e){}
  setTimeout(() => trocarAmbiente(para), 50);
}

/* Fotos: a do perfil (Termo Inicial) e, se não carregar nesta rede, a do Google; por fim, as iniciais. */
const iniciais = n => (n || '?').split(/\s+/).filter(w => w.length > 2 || /^[A-ZÁ-Ú]/.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?';
function fotoPessoa(p, cls = 'pfoto'){
  const fontes = [p.foto_caminho ? fotoUrl({ foto_caminho: p.foto_caminho }) : '', p.foto_google || ''].filter(Boolean);
  const ini = `<span class="ini">${esc(iniciais(p.nome))}</span>`;
  if (!fontes.length) return `<span class="${cls}">${ini}</span>`;
  return `<span class="${cls}">${ini}<img src="${esc(fontes[0])}" alt="" data-alt="${esc(fontes[1] || '')}" referrerpolicy="no-referrer" onerror="if(this.dataset.alt){this.src=this.dataset.alt;this.dataset.alt=''}else{this.remove()}"></span>`;
}

function ambMenu(btn){
  closeMenu();
  const el = document.createElement('div'); el.id = 'fmenu'; el.className = 'mpop menu emenu ambmenu'; document.body.appendChild(el);
  const it = (act, extra, ic, t, sub, on) => `<div class="it${on ? ' on' : ''}" data-act="${act}" ${extra}><span class="ic">${ic}</span><span>${t}${sub ? `<small>${sub}</small>` : ''}</span><span class="kb">${on ? I.check : ''}</span></div>`;
  let h = '<div class="h">Ambientes de trabalho</div>';
  if (!CLOUD.user) h += `<div class="it" data-act="go" data-v="config"><span class="ic">${I.user}</span><span>Entre com o Google<small>Para criar ambientes e convidar colegas</small></span><span></span></div>`;
  h += it('amb-ir', 'data-id=""', I.user, 'Agenda pessoal', 'Só sua, fora de qualquer empresa', !AMB_ATUAL);
  for (const a of AMB.lista) h += it('amb-ir', `data-id="${a.id}"`, I.team, esc(a.nome), esc([FUNCOES[a.funcao], setorNome(a, a.setor_id)].filter(Boolean).join(' · ')), a.id === AMB_ATUAL);
  if (AMB.convites.length) h += '<div class="sep"></div><div class="h">Convites para você</div>' + AMB.convites.map(c => it('conv-abrir', `data-id="${c.id}"`, I.mail, esc(c.ambiente), esc(`${FUNCOES[c.funcao]}${c.setor ? ' · ' + c.setor : ''} · de ${c.por ? c.por.nome : ''}`))).join('');
  if (CLOUD.user) h += '<div class="sep"></div>' + it('amb-criar', '', I.plus, 'Criar ambiente…', 'Uma empresa ou equipe, com setores e convites');
  el.innerHTML = h;
  const r = btn.getBoundingClientRect();
  el.style.left = Math.max(8, Math.min(r.left, innerWidth - el.offsetWidth - 8)) + 'px';
  el.style.top = Math.min(r.bottom + 6, innerHeight - el.offsetHeight - 8) + 'px';
}

async function conviteLinkVer(){
  let tok = ''; try { tok = localStorage.getItem('agendaInicial.conviteLink') || ''; } catch(e){}
  if (!tok || conviteVisto === tok || $('#modal:not([hidden]) .convite')) return;
  if (!CLOUD.user){
    if (conviteVisto === 'sem-login') return; conviteVisto = 'sem-login'; modal(`<h3>Convite para a Agenda Inicial</h3><p>Entre com a sua conta Google para ver e aceitar o convite.</p><div class="tools"><button class="btn" data-act="conv-esquecer">Agora não</button><button class="btn primary" data-act="cloud-in">Entrar com o Google</button></div>`); return; }
  conviteVisto = tok;
  try { conviteResponderModal(await ambRpc('convite_ver', { token: tok }), tok); }
  catch(e){ try { localStorage.removeItem('agendaInicial.conviteLink'); } catch(_){} toast('Este convite não vale mais: ' + (e.message || e), 7000); }
}

const TP = { el: null, ini: 0, itens: [], i: 0 };

  if (!itens.length) return tpFechar();

/* ---------------- Edição protegida ----------------
   Tarefas em segundo plano (nuvem, perfil, foto, anexos, virada do dia) nunca redesenham a tela enquanto um
   campo está sendo editado: o redesenho fica para quando o cursor sair do campo. Assim a edição não é
   interrompida nem volta ao texto salvo antes. */

  const a = document.activeElement;
  if (!a || a === document.body) return false;
  return a.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
}
function chavesEmEdicao(){

  if (ui.view === 'caderno' && ui.nbId) k.add('caderno:' + ui.nbId);

    // 2. enviar o que mudou aqui (inclui exclusões)

// Em comum: nome e inscrição na OAB. O resto do perfil (matrícula, cargo, e-mail e telefone da empresa) é só da agenda.
const GRUPO = { timer: null, last: 0, busy: false };
const fmtOab = n => String(n || '').replace(/\D/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
function parseOab(txt){
  const t = String(txt || '').trim();
  if (!t) return { oab_numero: '', oab_uf: '' };
  const m = t.match(/OAB\s*[\/\-–]?\s*([A-Za-z]{2})\D*([\d.]{3,9})/i) || t.match(/^([\d.]{3,9})\s*[\/\-–]\s*([A-Za-z]{2})$/);
  if (!m) return null;
  const [uf, num] = /^\d/.test(m[1]) ? [m[2], m[1]] : [m[1], m[2]];
  return { oab_numero: num.replace(/\D/g, ''), oab_uf: uf.toUpperCase() };
}
async function grupoRpc(gravar, dados){
  if (CLOUD.via === 'ponte') return ponte('rpc', gravar ? { fn: 'agendainicial_ponte_perfil_gravar', args: { p_dados: dados } } : { fn: 'agendainicial_ponte_perfil' });
  const sb = await cloudClient();
  const { data, error } = gravar ? await sb.rpc('inicial_perfil_gravar', { d: dados }) : await sb.rpc('inicial_perfil');
  if (error) throw error; return data;
}
function grupoAplicar(p){
  if (!p){ if (S.profile.grupo){ delete S.profile.grupo; save(false); } return; }
  const P = S.profile, antes = JSON.stringify([P.name, P.registro]), primeira = !P.grupo;
  const oabLocal = parseOab(P.registro);
  if (p.nome) P.name = p.nome;
  if (p.oab_numero && p.oab_uf) P.registro = `OAB/${p.oab_uf} nº ${fmtOab(p.oab_numero)}`;
  else if (oabLocal && oabLocal.oab_numero && !primeira) P.registro = '';
  P.grupo = { at: p.atualizado };
  fotoDoGrupo(p);
  if (primeira && !p.oab_numero && oabLocal && oabLocal.oab_numero) grupoAgendar();   // a OAB só existia na agenda: leva para o Termo Inicial
  save(false);
  if (antes !== JSON.stringify([P.name, P.registro])){ renderSide(); if (ui.view === 'perfil') renderBg(); }
}
async function grupoPuxar(forcar){
  if (!CLOUD.user || GRUPO.busy || GRUPO.timer) return;
  if (!forcar && Date.now() - GRUPO.last < 5 * 60000) return;
  GRUPO.busy = true;
  try { const p = await grupoRpc(false); GRUPO.last = Date.now(); if (!p || !S.profile.grupo || p.atualizado !== S.profile.grupo.at) grupoAplicar(p); else fotoDoGrupo(p); }
  catch(e){ console.warn('Perfil do grupo', e); }
  finally { GRUPO.busy = false; }
}
function grupoAgendar(){
  if (!CLOUD.user || !S.profile.grupo) return;
  clearTimeout(GRUPO.timer);
  GRUPO.timer = setTimeout(async () => {
    GRUPO.timer = null;
    const d = { nome: S.profile.name };
    const oab = parseOab(S.profile.registro);
    if (oab) Object.assign(d, oab);
    try { const p = await grupoRpc(true, d); if (p) S.profile.grupo = { at: p.atualizado }; save(false); grupoMsg('Salvo também no Termo Inicial.'); }
    catch(e){ grupoMsg('Só nesta agenda: ' + (e.message || e) + '.', true); }
  }, 1500);
}
const fotoUrl = p => p && p.foto_caminho ? `${SB_URL}/storage/v1/object/public/fotos-perfil/${p.foto_caminho.split('/').map(encodeURIComponent).join('/')}` : (p && p.foto_google) || '';
// Foto em 4×5 (retrato), recortada pelo centro, com o rosto mais perto do topo.
async function fotoReduzir(blob, largura){
  const bmp = await createImageBitmap(blob);
  let sw = bmp.width, sh = Math.round(sw * 5 / 4);
  if (sh > bmp.height){ sh = bmp.height; sw = Math.round(sh * 4 / 5); }
  const sx = Math.round((bmp.width - sw) / 2), sy = Math.round((bmp.height - sh) * 0.3);
  const W = Math.min(largura, sw), H = Math.round(W * 5 / 4);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  c.getContext('2d').drawImage(bmp, sx, sy, sw, sh, 0, 0, W, H);
  return new Promise(r => c.toBlob(r, 'image/jpeg', .86));
}
const blobParaDados = b => new Promise((r, j) => { const f = new FileReader(); f.onload = () => r(f.result); f.onerror = j; f.readAsDataURL(b); });
async function fotoDoGrupo(p){

  if (!url){ delete P.foto; delete P.fotoFonte; save(false); renderSide(); if (ui.view === 'perfil') renderBg(); return; }
  try { const r = await fetch(url, { mode: 'cors' }); if (!r.ok) throw new Error(r.status); P.foto = await blobParaDados(await fotoReduzir(await r.blob(), 240)); P.fotoFormato = '4x5'; }
  catch(e){ if (CLOUD.via === 'ponte' && url.startsWith(SB_URL)) return; P.foto = url; }   // sem acesso direto: usa o endereço da imagem
  P.fotoFonte = url; save(false); renderSide(); if (ui.view === 'perfil') renderBg();
}
async function fotoTrocar(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/jpeg,image/png,image/webp';

// em Documentos/Agenda Inicial/arquivos/AAAA-MM — a mesma estrutura da pasta local.
const TERMO_NUVEM = 'https://termoinicial.vercel.app/api/agenda-inicial/nuvem';   // o Termo Inicial entrega o acesso (a credencial fica no servidor dele)

const nuvemEscolhida = () => S.settings.nuvemProv !== undefined ? S.settings.nuvemProv : (NUV.conectadas && NUV.conectadas.some(c => c.provedor === 'onedrive') ? 'onedrive' : '');

async function nuvemFuncao(corpo){

  const r = await fetch(TERMO_NUVEM, { method: 'POST', headers: { authorization: `Bearer ${data.session ? data.session.access_token : ''}`, 'content-type': 'application/json' }, body: JSON.stringify(corpo) });

async function nuvemConectadas(forcar){

    if (esc_ && NUV.conectadas.some(c => c.provedor === esc_)){ try { await nuvemToken(esc_); NUV.pronto[esc_] = true; } catch(e){ NUV.erro = e.message; } }

async function odPedir(url, init = {}){
  const tk = await nuvemToken('onedrive');
  const r = await fetch(url.startsWith('http') ? url : 'https://graph.microsoft.com/v1.0' + url, { ...init, headers: { authorization: 'Bearer ' + tk, ...(init.headers || {}) } });
  if (!r.ok){ let m = r.status; try { const j = await r.json(); m = (j.error && j.error.message) || m; } catch(e){} throw new Error('OneDrive: ' + m); }
  return r;
}
async function odEnviar(blob, rel){
  const alvo = `/me/drive/special/documents:/${encPath('Agenda Inicial/' + rel)}:`;
  if (blob.size <= 4 * 1024 * 1024) return (await odPedir(`${alvo}/content?@microsoft.graph.conflictBehavior=replace`, { method: 'PUT', body: blob })).json();
  const ses = await (await odPedir(`${alvo}/createUploadSession`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ item: { '@microsoft.graph.conflictBehavior': 'replace' } }) })).json();
  const PED = 320 * 1024 * 20; let ini = 0, fim, r;
  while (ini < blob.size){
    fim = Math.min(ini + PED, blob.size);
    r = await fetch(ses.uploadUrl, { method: 'PUT', headers: { 'content-range': `bytes ${ini}-${fim - 1}/${blob.size}` }, body: blob.slice(ini, fim) });
    if (!r.ok && r.status !== 202) throw new Error('OneDrive: envio interrompido (' + r.status + ')');
    ini = fim;
  }
  return r.json();
}
async function gdPedir(url, init = {}){
  const tk = await nuvemToken('gdrive');
  const r = await fetch(url, { ...init, headers: { authorization: 'Bearer ' + tk, ...(init.headers || {}) } });
  if (!r.ok){ let m = r.status; try { const j = await r.json(); m = (j.error && j.error.message) || m; } catch(e){} throw new Error('Google Drive: ' + m); }
  return r;
}
async function gdPasta(caminho){   // Documentos/Agenda Inicial/arquivos/AAAA-MM, criando o que faltar (o Drive só mostra ao app o que ele criou)
  S.settings.gdPastas = S.settings.gdPastas || {};
  if (S.settings.gdPastas[caminho]) return S.settings.gdPastas[caminho];
  let pai = 'root', acc = '';
  for (const nome of caminho.split('/')){
    acc += (acc ? '/' : '') + nome;
    if (S.settings.gdPastas[acc]){ pai = S.settings.gdPastas[acc]; continue; }
    const q = `name='${nome.replace(/'/g, "\\'")}' and '${pai}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`;
    const l = await (await gdPedir('https://www.googleapis.com/drive/v3/files?fields=files(id)&q=' + encodeURIComponent(q))).json();
    pai = l.files && l.files[0] ? l.files[0].id : (await (await gdPedir('https://www.googleapis.com/drive/v3/files?fields=id', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: nome, mimeType: 'application/vnd.google-apps.folder', parents: [pai] }) })).json()).id;
    S.settings.gdPastas[acc] = pai;
  }
  save(false); return pai;
}
async function gdEnviar(blob, rel){
  const partes = ('Documentos/Agenda Inicial/' + rel).split('/'), nome = partes.pop(), pai = await gdPasta(partes.join('/'));
  const ini = await gdPedir('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,webViewLink', { method: 'POST', headers: { 'content-type': 'application/json; charset=UTF-8', 'x-upload-content-type': blob.type || 'application/octet-stream' }, body: JSON.stringify({ name: nome, parents: [pai] }) });
  const r = await fetch(ini.headers.get('location'), { method: 'PUT', body: blob });

}

  const item = V.list[V.i], kind = kindOf(item.name), tok = ++V.token;
  const body = $('#vbody'), tabs = $('#vtabs');
  body.className = 'vbody'; tabs.innerHTML = ''; V.zoom = 1;
  vBar(item, ['docx','sheet','pptx','image','text','md'].includes(kind) ? zoomTools() : '');
  body.innerHTML = '<div class="vload">Carregando…</div>';
  let file;
  try { file = await fileOf(item); } catch(e){ if (tok === V.token) vMsg('Não consegui abrir o arquivo', esc(e.message), item); return; }
  if (tok !== V.token) return;
  V.file = file;
  const ext = extOf(item.name);
  try {
    if (kind === 'pdf'){
      const anotavel = !!item.id && S.files.includes(item);
      try {
        if (!anotavel) throw new Error('avulso');
        await abrirPdf(item, file, body, tok);
        vBar(item, zoomTools() + marcasTools());
      } catch(e){
        if (e.message !== 'avulso') console.warn('pdf.js', e);
        body.classList.add('flush');
        V.url = URL.createObjectURL(new Blob([file], { type: 'application/pdf' }));
        body.innerHTML = `<iframe src="${V.url}#view=FitH" title="${esc(item.name)}"></iframe>`;
      }
    }
    else if (kind === 'image'){
      V.url = URL.createObjectURL(new Blob([file], { type: MIME[ext] || file.type }));
      body.innerHTML = `<div class="vimg vzoom"><img src="${V.url}" alt="${esc(item.name)}" data-act="v-imgfull" title="Clique para ver em tamanho real"></div>`;
    }
    else if (kind === 'audio' || kind === 'video'){
      V.url = URL.createObjectURL(new Blob([file], { type: MIME[ext] || file.type }));
      body.innerHTML = `<div class="vmedia">${kind === 'video' ? `<video src="${V.url}" controls autoplay></video>` : `<audio src="${V.url}" controls autoplay></audio>`}</div>`;
    }
    else if (kind === 'md'){
      const html = await mdToHtml(await file.text(), true);
      if (tok !== V.token) return;
      body.innerHTML = `<div class="nb-view vzoom"><div class="nb-doc ro">${html}</div></div>`;
    }
    else if (kind === 'text'){
      let t = await file.text();
      if (ext === 'html' || ext === 'htm'){
        body.classList.add('flush');
        V.url = URL.createObjectURL(new Blob([t], { type: 'text/html' }));
        body.innerHTML = `<iframe sandbox="" src="${V.url}" title="${esc(item.name)}"></iframe>`;
      } else {
        if (ext === 'json'){ try { t = JSON.stringify(JSON.parse(t), null, 2); } catch(e){} }
        if (t.length > 2e6) t = t.slice(0, 2e6) + '\n\n[… arquivo muito grande, exibidos os primeiros 2 MB]';
        body.innerHTML = `<pre class="vtext vzoom">${esc(t)}</pre>`;
      }
    }
    else if (kind === 'docx'){
      await lib('jszip'); await lib('docx');
      if (tok !== V.token) return;
      body.innerHTML = '<div class="vdocx vzoom"><div id="vdoc"></div></div>';
      await window.docx.renderAsync(await file.arrayBuffer(), $('#vdoc'), null, { className: 'docx', inWrapper: true, breakPages: true, renderHeaders: true, renderFooters: true, renderFootnotes: true, renderEndnotes: true, useBase64URL: true, experimental: true });
      if (item.id && S.files.includes(item)){ MK.item = item; $$('#vdoc section.docx').forEach((sec, k) => { sec.dataset.pagina = k + 1; desenharMarcas(sec); }); vBar(item, zoomTools() + marcasTools()); V.cleanup = () => { MK.item = null; fecharBarra(); }; if (V.pagina){ const a = $(`#vdoc [data-pagina="${V.pagina}"]`); if (a) setTimeout(() => a.scrollIntoView({ block: 'start' }), 60); V.pagina = 0; } }
    }
    else if (kind === 'sheet'){
      await lib('xlsx');
      if (tok !== V.token) return;
      const data = ext === 'csv' || ext === 'tsv' ? await file.text() : await file.arrayBuffer();
      const wb = window.XLSX.read(data, { type: typeof data === 'string' ? 'string' : 'array', cellDates: true, dense: false, FS: ext === 'tsv' ? '\t' : undefined });
      V.wb = wb; V.sheet = 0;
      tabs.innerHTML = wb.SheetNames.map((n, i) => `<button data-act="v-sheet" data-i="${i}" class="${i ? '' : 'on'}">${esc(n)}</button>`).join('');
      renderSheet();
    }
    else if (kind === 'pptx'){
      await lib('jszip'); await lib('pptx');
      if (tok !== V.token) return;
      const buf = await file.arrayBuffer();
      let ratio = 9 / 16;
      try { const zx = await window.JSZip.loadAsync(buf); const px = await zx.file('ppt/presentation.xml').async('string'); const m = px.match(/<p:sldSz[^>]*cx="(\d+)"[^>]*cy="(\d+)"/); if (m) ratio = +m[2] / +m[1]; } catch(e){}
      const w = Math.min(1100, body.clientWidth - 64);
      body.innerHTML = '<div class="vpptx vzoom"><div id="vppt"></div></div>';
      const pv = window.pptxPreview.init($('#vppt'), { width: w, height: Math.round(w * ratio), mode: 'list' });
      V.cleanup = () => pv.destroy && pv.destroy();
      await pv.preview(buf);
    }
    else if (['doc','ppt','pps','odt','odp','rtf','msg','pub','vsd','vsdx'].includes(ext)){
      vMsg('Este formato não tem visualização dentro da agenda', 'Arquivos .' + esc(ext) + ' abrem melhor no aplicativo de origem.', item);
    }
    else vMsg('Formato sem visualização', 'Não há visualizador para arquivos .' + esc(ext || '?') + '. Você pode abri-lo no aplicativo do computador.', item);
  } catch(e){
    console.warn(e);
    if (tok === V.token) vMsg('Não consegui exibir este arquivo', esc(e.message || 'O arquivo pode estar corrompido ou protegido por senha.'), item);
  }
}
function renderSheet(){
  const X = window.XLSX, ws = V.wb.Sheets[V.wb.SheetNames[V.sheet]];
  $$('#vtabs button').forEach((b, i) => b.classList.toggle('on', i === V.sheet));
  if (!ws || !ws['!ref']){ $('#vbody').innerHTML = '<div class="vmsg"><div><b>Planilha vazia</b></div></div>'; return; }
  const r = X.utils.decode_range(ws['!ref']); const MAXR = 3000, MAXC = 200;
  const r2 = Math.min(r.e.r, r.s.r + MAXR - 1), c2 = Math.min(r.e.c, r.s.c + MAXC - 1);
  const skip = new Set(), span = {};
  for (const m of ws['!merges'] || []){
    span[m.s.r + ',' + m.s.c] = [m.e.r - m.s.r + 1, m.e.c - m.s.c + 1];
    for (let R = m.s.r; R <= m.e.r; R++) for (let C = m.s.c; C <= m.e.c; C++) if (R !== m.s.r || C !== m.s.c) skip.add(R + ',' + C);
  }
  const cols = ws['!cols'] || [];
  let h = '<table><thead><tr><th></th>';
  for (let C = r.s.c; C <= c2; C++) h += `<th style="min-width:${Math.max(48, Math.min(360, ((cols[C] && (cols[C].wpx || (cols[C].wch || 0) * 7)) || 72)))}px">${X.utils.encode_col(C)}</th>`;
  h += '</tr></thead><tbody>';
  for (let R = r.s.r; R <= r2; R++){
    h += `<tr><th>${R + 1}</th>`;
    for (let C = r.s.c; C <= c2; C++){
      const k = R + ',' + C; if (skip.has(k)) continue;
      const cell = ws[X.utils.encode_cell({ r: R, c: C })];
      const sp = span[k] ? ` rowspan="${span[k][0]}" colspan="${span[k][1]}"` : '';
      let txt = '', cls = '';
      if (cell){
        if (cell.f && (cell.v === undefined || cell.v === '')){ txt = '=' + cell.f; cls = 'f'; }
        else if (cell.w !== undefined) txt = cell.w;
        else if (cell.v instanceof Date) txt = cell.v.toLocaleDateString('pt-BR');
        else if (cell.v !== undefined) txt = String(cell.v);
        else if (cell.f){ txt = '=' + cell.f; cls = 'f'; }
        if (cell.t === 'n' && !cls) cls = 'n';
      }
      h += `<td class="${cls}"${sp} title="${esc(cell && cell.f ? '=' + cell.f : txt)}">${esc(txt)}</td>`;
    }
    h += '</tr>';
  }
  h += '</tbody></table>';
  if (r.e.r > r2 || r.e.c > c2) h += `<div class="more">Exibindo as primeiras ${r2 - r.s.r + 1} linhas e ${c2 - r.s.c + 1} colunas. Para ver tudo, abra no Excel.</div>`;
  $('#vbody').innerHTML = `<div class="vsheet vzoom">${h}</div>`;
  applyZoom();
}

async function uniqueNbPath(title, exceptId){

async function nbCreate(title, linkEntryId){

async function mdLibs(){ await lib('marked'); }
async function htmlLibs(){ await lib('turndown'); await lib('gfm'); }
function encPath(p){ return p.split('/').map(encodeURIComponent).join('/'); }
function sanitize(root){
  root.querySelectorAll('script,style,iframe,object,embed,form,input,button,link,meta').forEach(n => n.remove());
  root.querySelectorAll('*').forEach(n => { for (const a of [...n.attributes]){ if (/^on/i.test(a.name) || (a.name === 'href' && /^\s*javascript:/i.test(a.value)) || a.name === 'style') n.removeAttribute(a.name); } });
}
async function mdToHtml(md, readonly){
  await mdLibs();

  box.innerHTML = window.marked.parse(md || '', { gfm: true, breaks: false });
  sanitize(box);
  box.querySelectorAll('a[href]').forEach(a => {
    let h = a.getAttribute('href') || '';
    try { h = decodeURIComponent(h); } catch(e){}
    h = h.replace(/^<|>$/g, '');
    const m = h.match(/^(?:\.\.\/)?((?:arquivos|cadernos)\/.+)$/);
    if (m){ const span = document.createElement('a'); span.className = 'mention' + (m[1].startsWith('cadernos/') ? ' nb' : ''); span.dataset.path = m[1]; span.dataset.name = a.textContent; span.textContent = a.textContent; span.setAttribute('contenteditable', 'false'); span.href = '#'; a.replaceWith(span); }
    else { a.setAttribute('target', '_blank'); a.setAttribute('rel', 'noopener'); }
  });

}
let _td = null;
function turndown(){
  if (_td) return _td;
  _td = new window.TurndownService({ headingStyle: 'atx', bulletListMarker: '-', codeBlockStyle: 'fenced', emDelimiter: '*', strongDelimiter: '**', hr: '---' });
  _td.use(window.turndownPluginGfm.gfm);

  _td.addRule('underline', { filter: ['u', 'ins'], replacement: c => c.trim() ? `<u>${c}</u>` : c });
  _td.addRule('strike2', { filter: ['s', 'strike', 'del'], replacement: c => c.trim() ? `~~${c}~~` : c });
  _td.addRule('listItem1', { filter: 'li', replacement: (content, node) => {
    const par = node.parentNode; let prefix = '- ';
    if (par.nodeName === 'OL'){ const st = par.getAttribute('start'); const idx = Array.prototype.indexOf.call(par.children, node); prefix = (st ? Number(st) + idx : idx + 1) + '. '; }
    content = content.replace(/^\n+/, '').replace(/\n+$/, '\n').replace(/\n/gm, '\n' + ' '.repeat(prefix.length));
    return prefix + content + (node.nextSibling && !/\n$/.test(content) ? '\n' : '');
  } });
  _td.addRule('cellBreak', { filter: n => n.nodeName === 'BR' && n.closest && n.closest('td,th'), replacement: () => '' });
  _td.addRule('emptyPara', { filter: n => (n.nodeName === 'P' || n.nodeName === 'DIV') && !n.textContent.trim() && !n.querySelector('img,.mention'), replacement: () => '\n' });
  _td.addRule('spanStyled', { filter: n => n.nodeName === 'SPAN' && !n.classList.length, replacement: c => c });
  return _td;
}

async function nbRename(newTitle){
  const f = nbById(ui.nbId); if (!f) return;
  const t = (newTitle || '').trim() || 'Caderno sem título';
  if (t === f.title) return;
  const { name, path } = await uniqueNbPath(t, f.id);
  if (path !== f.path && FS.state === 'granted'){
    try {
      const md = await htmlToMd($('#nbdoc') ? $('#nbdoc').innerHTML : ui.nbHtml || '');
      await writeRel(path, new Blob([md], { type: 'text/markdown' }));
      const parts = f.path.split('/'); const old = parts.pop();
      try { await (await dirAt(parts.join('/'), false)).removeEntry(old); } catch(e){}
      // atualiza menções a este caderno nos demais cadernos fica para a próxima abertura deles
      for (const o of S.files) if (o.kind === 'caderno' && o.id !== f.id) o.renamedFrom = o.renamedFrom || null;
      f.path = path; f.name = name;
    } catch(e){ toast('Não consegui renomear o arquivo: ' + e.message); return; }
  } else if (path !== f.path){ f.path = path; f.name = name; }
  f.title = t; f.updatedAt = Date.now(); save(false); renderSide();

  const sub = $('#nb-path'); if (sub) sub.textContent = 'Documentos › Agenda Inicial › ' + f.path.replace('/', ' › ');
}

/* Menções: ## + nome do arquivo ou caderno */
function nbMentionCheck(){
  const sel = getSelection(); if (!sel.rangeCount || !sel.isCollapsed){ nbPopClose(); return; }
  const node = sel.anchorNode; if (!node || node.nodeType !== 3 || !node.parentNode.closest || !node.parentNode.closest('#nbdoc')){ nbPopClose(); return; }
  const before = node.textContent.slice(0, sel.anchorOffset);
  const m = before.match(/##(?![\s#])([^#\n]{0,48})$/) || before.match(/##$/);
  if (!m){ nbPopClose(); return; }
  const q = (m[1] || '').trim();
  const norm = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const items = S.files.filter(f => f.id !== ui.nbId && (!q || norm(f.kind === 'caderno' ? f.title : f.name).includes(norm(q)))).sort((a, b) => (b.updatedAt || b.addedAt) - (a.updatedAt || a.addedAt)).slice(0, 8);
  const r = sel.getRangeAt(0).cloneRange(); const rect = r.getClientRects()[0] || node.parentNode.getBoundingClientRect();
  NB.pop = { node, end: sel.anchorOffset, start: sel.anchorOffset - m[0].length, items, i: 0 };
  let el = $('#mpop'); if (!el){ el = document.createElement('div'); el.id = 'mpop'; el.className = 'mpop'; document.body.appendChild(el); }
  el.innerHTML = `<div class="h">Mencionar arquivo ou caderno</div>` + (items.length ? items.map((f, i) => `<div class="it ${i ? '' : 'on'}" data-mi="${i}"><span class="ext">${f.kind === 'caderno' ? 'cad' : esc(extOf(f.name))}</span><span>${esc(f.kind === 'caderno' ? f.title : f.name)}</span></div>`).join('') : '<div class="none">Nenhum arquivo com esse nome.</div>');
  el.style.left = Math.min(rect.left, innerWidth - 360) + 'px';
  el.style.top = (rect.bottom + 6 + 300 > innerHeight ? rect.top - 306 : rect.bottom + 6) + 'px';
}
function nbPopClose(){ NB.pop = null; const el = $('#mpop'); if (el) el.remove(); }
function nbPopMove(d){ if (!NB.pop || !NB.pop.items.length) return; NB.pop.i = (NB.pop.i + d + NB.pop.items.length) % NB.pop.items.length; $$('#mpop .it').forEach((e, i) => e.classList.toggle('on', i === NB.pop.i)); }
function nbPopPick(i){
  const P = NB.pop; if (!P || !P.items[i]) return; const f = P.items[i];
  const r = document.createRange(); r.setStart(P.node, Math.max(0, P.start)); r.setEnd(P.node, P.end); r.deleteContents();

function nbAutoFormat(ev){
  if (ev.key !== ' ') return false;
  const sel = getSelection(); const n = sel.anchorNode; if (!n || n.nodeType !== 3) return false;
  const before = n.textContent.slice(0, sel.anchorOffset);
  let blk = n.parentNode; while (blk && blk.id !== 'nbdoc' && !/^(P|DIV|H[1-6]|LI)$/.test(blk.nodeName)) blk = blk.parentNode;
  if (!blk || blk.nodeName === 'LI') return false;
  const firstText = blk.id === 'nbdoc' ? n : blk.firstChild;
  if (firstText !== n) return false;
  const map = { '#': 'H1', '##': 'H2', '###': 'H3', '-': 'ul', '*': 'ul', '1.': 'ol' };
  const k = before; if (!map[k]) return false;
  ev.preventDefault(); nbPopClose();
  const rest = n.textContent.slice(k.length);
  let target = n;
  if (blk.id === 'nbdoc'){ const p = document.createElement('p'); n.replaceWith(p); if (rest){ p.textContent = rest; target = p.firstChild; } else { p.innerHTML = '<br>'; target = p; } }
  else if (rest) n.textContent = rest; else { const br = document.createElement('br'); n.replaceWith(br); target = blk; }
  const r = document.createRange(); r.setStart(target, 0); r.collapse(true); sel.removeAllRanges(); sel.addRange(r);
  if (map[k] === 'ul') document.execCommand('insertUnorderedList'); else if (map[k] === 'ol') document.execCommand('insertOrderedList'); else document.execCommand('formatBlock', false, map[k]);
  nbChanged(); return true;
}

    try { const d = JSON.parse(await t.files[0].text()); if (!d.entries) throw 0; if (!confirm('Substituir os dados atuais pelos do arquivo importado?')) return; S = migrate(d); resetHolidayCache(); save(); toast('Cópia importada.'); } catch(e){ toast('Arquivo inválido.'); }
    t.value = '';
  }
});
// Arrastar e soltar arquivos
document.addEventListener('dragover', ev => { const d = ev.target.closest && ev.target.closest('#drop'); if (d){ ev.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', ev => { const d = ev.target.closest && ev.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', ev => { const d = ev.target.closest && ev.target.closest('#drop'); if (d){ ev.preventDefault(); d.classList.remove('over'); uploadFiles(ev.dataTransfer.files); } });
$('#main').addEventListener('scroll', () => { const tb = $('.topbar'); tb && tb.classList.toggle('scrolled', $('#main').scrollTop > 4); });
window.addEventListener('beforeunload', () => { if (NB.dirty) nbSave(); });
window.addEventListener('storage', ev => { if (ev.key === lsKey() && ev.newValue){ S = migrate(JSON.parse(ev.newValue)); render(false); } });
// Virada do dia com a agenda aberta
setInterval(() => { if (ui._today !== today()){ const was = ui._today; ui._today = today(); if (was && ui.view === 'hoje' && ui.date === was && !editando()){ ui.date = today(); } renderBg(); } }, 60000);

/* ---------------- Início ---------------- */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window._bip = e; renderSide(); if (ui.view === 'config') render(false); });
window.addEventListener('appinstalled', () => { window._bip = null; try { localStorage.setItem(INST_KEY, '1'); } catch(e){} renderSide(); toast('Agenda Inicial instalada. Ela agora abre como aplicativo, com ícone próprio.', 5000); });
if (/^https?:$/.test(location.protocol) && 'serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded && UP.newer){ reloaded = true; location.reload(); } });
}
(async function start(){
  ui._today = today();
  { const h = location.hash.slice(1); if (['hoje','cal','futuro','cadernos','arquivos','ponto','perfil','config'].includes(h)) ui.view = h; }
  if (location.hash.startsWith('#ver=')){
    const path = decodeURIComponent(location.hash.slice(5)); V.only = true;
    document.body.classList.add('vonly'); applyTheme(); document.title = path.split('/').pop() + ' · Agenda Inicial';
    await initFS();
    const f = S.files.find(x => x.path === path) || { name: path.split('/').pop(), path };
    if (FS.state === 'granted') openViewer([f], 0);
    else if (!FS.root){ openViewer([f], 0); $('#vbody').innerHTML = '<div class="vmsg"><div><b>Pasta ainda não autorizada</b>Abra a Agenda Inicial e clique em Autorizar; depois tente de novo.</div></div>'; }
    else { openViewer([f], 0); $('#vbody').innerHTML = '<div class="vmsg"><div><b>Clique aqui para liberar o acesso à pasta</b>O navegador pede uma confirmação ao abrir uma janela nova.</div></div>'; window.addEventListener('pointerdown', async () => { try { if (FS.root && await FS.root.requestPermission({ mode: 'readwrite' }) === 'granted'){ FS.state = 'granted'; showViewer(); } } catch(e){} }, { once: true }); }
    return;
  }
  applyTheme();
  render(false);
  await initFS();
  render();
  if (pontoInfo().pending) document.title = '• Ponto pendente · Agenda Inicial';
  setTimeout(() => checkUpdate(), 1500);
  setInterval(() => checkUpdate(), 6 * 3600 * 1000);
  if (ponteChave() && !localStorage.getItem('agendaInicial.sessao') && SYNC.user){ CLOUD.via = 'ponte'; CLOUD.user = { id: SYNC.user, email: 'conectada pela ponte do Google' }; cloudSync(); }
  else if (/^https?:$/.test(location.protocol) && (localStorage.getItem('agendaInicial.sessao') || /[?&]code=/.test(location.search))){
    try { const sb = await cloudClient(); const { data } = await sb.auth.getSession(); if (data && data.session && !CLOUD.user){ CLOUD.user = data.session.user; SYNC.user = CLOUD.user.id; saveSync(); cloudSync(true); } } catch(e){ console.warn(e); }
  }
})();
</script>
