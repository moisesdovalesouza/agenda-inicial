/* ---------------- Tags (#) ----------------
   #palavra no texto (registro, caderno, lista) ou como classificação (registro, caderno, lista, documento).
   "# Título" (com espaço) continua sendo título no caderno, e "##" continua mencionando arquivo. */
const TAG_RE = /(^|[\s(\[{,;:>"'“])#([\p{L}\p{N}][\p{L}\p{N}_\-]{0,39})/gu;
const tagKey = t => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const limpaTag = t => String(t || '').trim().replace(/^#+/, '').replace(/[^\p{L}\p{N}_\-]+/gu, '-').replace(/^-+|-+$/g, '').slice(0, 40);
function tagsTexto(txt){ const s = new Map(); for (const m of String(txt || '').matchAll(TAG_RE)) s.set(tagKey(m[2]), m[2]); return [...s.values()]; }
function textoDe(tipo, o){
  if (tipo === 'registro') return o.text;
  if (tipo === 'lista') return [o.notes, ...(o.items || []).map(i => i.text)].join('\n');
  if (tipo === 'caderno') return o.md || o.preview || '';
  return '';
}
function tagsDe(tipo, o){
  const m = new Map();
  for (const t of [...(o.tags || []), ...tagsTexto(textoDe(tipo, o))]) if (!m.has(tagKey(t))) m.set(tagKey(t), t);
  return [...m.values()];
}
function todasTags(){
  const m = new Map(), add = (t) => { const k = tagKey(t), x = m.get(k); if (x) x.n++; else m.set(k, { nome: t, n: 1 }); };
  for (const e of S.entries) tagsDe('registro', e).forEach(add);
  for (const l of S.lists) tagsDe('lista', l).forEach(add);
  for (const f of S.files) tagsDe(f.kind === 'caderno' ? 'caderno' : 'arquivo', f).forEach(add);
  return [...m.values()].sort((a, b) => b.n - a.n || a.nome.localeCompare(b.nome, 'pt-BR'));
}
const tagChip = (t, x) => `<a class="htag" href="#" data-act="tag-go" data-tag="${esc(t)}" title="Ver tudo com #${esc(t)}">#${esc(t)}${x ? `<span class="x" data-act="tag-rm" data-tag="${esc(t)}" title="Tirar a tag">×</span>` : ''}</a>`;
/* Texto com as #tags clicáveis (o texto já vem escapado). */
const comTags = html => html.replace(TAG_RE, (m, a, t) => `${a}<a class="htag" href="#" data-act="tag-go" data-tag="${t}" title="Ver tudo com #${t}">#${t}</a>`);
/* Linha de classificação: as tags do item (as do texto aparecem no próprio texto). */
function tagLine(tipo, id, o, botao = true){
  const tags = o.tags || [];

}
function alvoTag(tk, tid){
  if (tk === 'registro') return byId(tid);
  if (tk === 'lista') return S.lists.find(l => l.id === tid);
  return S.files.find(f => f.id === tid);
}
function tagEditor(tk, tid){
  const o = alvoTag(tk, tid); if (!o) return;
  const todas = todasTags();
  modal(`<h3>Tags</h3>
    <p class="muted">Classifique com uma ou mais tags. Dentro do texto, basta escrever <b>#palavra</b>.</p>
    <div class="tagline" id="tg-atuais" style="margin-bottom:var(--s3)">${(o.tags || []).map(t => tagChip(t, true).replace('data-act="tag-go"', `data-act="tag-go" data-tk="${tk}" data-tid="${tid}"`)).join('') || '<span class="muted small">Sem tags ainda.</span>'}</div>
    <input class="inp" id="tg-in" placeholder="Nova tag (Enter)" autocomplete="off" style="width:100%" data-tk="${tk}" data-tid="${tid}">
    ${todas.length ? `<p class="muted small" style="margin:var(--s3) 0 var(--s1)">Já usadas</p><div class="tagline">${todas.slice(0, 30).map(x => `<button class="tagadd" data-act="tag-pick" data-tk="${tk}" data-tid="${tid}" data-tag="${esc(x.nome)}">#${esc(x.nome)}</button>`).join('')}</div>` : ''}
    <div class="tools"><button class="btn primary" data-act="m-close">Pronto</button></div>`);
  setTimeout(() => { const i = $('#tg-in'); if (i) i.focus(); }, 30);

function tagPor(tk, tid, tag, tirar){
  const o = alvoTag(tk, tid); tag = limpaTag(tag); if (!o || !tag) return;
  o.tags = (o.tags || []).filter(t => tagKey(t) !== tagKey(tag));

  if (!o.tags.length) delete o.tags;
  if (tk === 'arquivo' || tk === 'caderno') o.updatedAt = Date.now();

/* Sugestões ao digitar # (campos de texto, registros, listas e cadernos). */
const TP = { el: null, ini: 0, itens: [], i: 0 };
function tpFechar(){ TP.el = null; const p = $('#tpop'); if (p) p.remove(); }
function tpAntes(el){
  if (el.isContentEditable){
    const sel = getSelection(); if (!sel.rangeCount) return null;
    const r = sel.getRangeAt(0); if (!r.collapsed || r.startContainer.nodeType !== 3) return null;
    return { txt: r.startContainer.textContent.slice(0, r.startOffset), node: r.startContainer, off: r.startOffset, rect: r.getBoundingClientRect() };
  }
  if (typeof el.selectionStart !== 'number') return null;
  const b = el.getBoundingClientRect();
  return { txt: el.value.slice(0, el.selectionStart), rect: { left: b.left + 8, bottom: b.bottom } };
}
function tpVer(el){
  const a = tpAntes(el); if (!a) return tpFechar();
  const m = a.txt.match(/(^|[\s(\[{,;:>"'“])#([\p{L}\p{N}_\-]{0,40})$/u);
  if (!m) return tpFechar();
  const q = tagKey(m[2]);
  const itens = todasTags().filter(x => tagKey(x.nome).startsWith(q) && tagKey(x.nome) !== q).slice(0, 8);
  if (!itens.length) return tpFechar();
  Object.assign(TP, { el, itens, i: 0, q: m[2], node: a.node, off: a.off });
  let p = $('#tpop'); if (!p){ p = document.createElement('div'); p.id = 'tpop'; document.body.appendChild(p); }
  p.innerHTML = itens.map((x, i) => `<div class="it${i ? '' : ' on'}" data-ti="${i}"><span>#${esc(x.nome)}</span><small>${x.n}</small></div>`).join('');
  const r = a.rect || { left: 0, bottom: 0 };
  p.style.left = Math.min(r.left || 0, innerWidth - 300) + 'px'; p.style.top = Math.min((r.bottom || 0) + 4, innerHeight - 230) + 'px';
}
function tpEscolher(i){
  const x = TP.itens[i], el = TP.el; if (!x || !el) return tpFechar();
  if (el.isContentEditable){
    const n = TP.node; n.textContent = n.textContent.slice(0, TP.off - TP.q.length) + x.nome + ' ' + n.textContent.slice(TP.off);
    const r = document.createRange(); r.setStart(n, TP.off - TP.q.length + x.nome.length + 1); r.collapse(true); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  } else {
    const p = el.selectionStart; el.setRangeText(x.nome + ' ', p - TP.q.length, p, 'end');
  }
  el.dispatchEvent(new Event('input', { bubbles: true }));
  tpFechar();
}
document.addEventListener('input', ev => { const el = ev.target; if (el && (el.isContentEditable || /^(INPUT|TEXTAREA)$/.test(el.tagName)) && el.id !== 'tg-in' && el.type !== 'date') tpVer(el.isContentEditable ? (el.closest('[contenteditable="true"]') || el) : el); });
document.addEventListener('keydown', ev => {
  if (ev.target && ev.target.id === 'tg-in' && ev.key === 'Enter'){ ev.preventDefault(); const t = ev.target; if (t.value.trim()){ tagPor(t.dataset.tk, t.dataset.tid, t.value); } return; }
  if (!TP.el || !$('#tpop')) return;
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp'){ ev.preventDefault(); ev.stopImmediatePropagation(); TP.i = (TP.i + (ev.key === 'ArrowDown' ? 1 : -1) + TP.itens.length) % TP.itens.length; $$('#tpop .it').forEach((e, i) => e.classList.toggle('on', i === TP.i)); }
  else if (ev.key === 'Enter' || ev.key === 'Tab'){ ev.preventDefault(); ev.stopImmediatePropagation(); tpEscolher(TP.i); }
  else if (ev.key === 'Escape'){ ev.stopImmediatePropagation(); tpFechar(); }
}, true);
document.addEventListener('mousedown', ev => { const it = ev.target.closest('#tpop .it'); if (it){ ev.preventDefault(); tpEscolher(+it.dataset.ti); } else if (!ev.target.closest('#tpop')) tpFechar(); }, true);

/* ---------------- Edição protegida ----------------
   Tarefas em segundo plano (nuvem, perfil, foto, anexos, virada do dia) nunca redesenham a tela enquanto um
   campo está sendo editado: o redesenho fica para quando o cursor sair do campo. Assim a edição não é
   interrompida nem volta ao texto salvo antes. */
function editando(){
  const a = document.activeElement;
  if (!a || a === document.body) return false;
  return a.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
}
function chavesEmEdicao(){
  const k = new Set(), a = document.activeElement;
  if (!editando()) return k;
  const en = a.closest && a.closest('.entry[data-id]'); if (en) k.add('registro:' + en.dataset.id);
  if (a.id === 'daynotes') k.add('dia:' + ui.date);
  if (ui.view === 'lista' && ui.listId) k.add('lista:' + ui.listId);
  if (ui.view === 'caderno' && ui.nbId) k.add('caderno:' + ui.nbId);
  if (a.dataset && a.dataset.prof) k.add('ajuste:perfil');
  return k;
}
const EDIT = { pend: false, linhas: [] };
function renderBg(){
  if (editando() || (ui.view === 'caderno' && typeof NB !== 'undefined' && NB.dirty)){ EDIT.pend = true; return; }
  render(false);
}
document.addEventListener('focusout', () => setTimeout(() => {
  if (editando()) return;
  if (EDIT.linhas.length && typeof aplicarAdiadas === 'function') aplicarAdiadas();
  if (EDIT.pend){ EDIT.pend = false; if (!(ui.view === 'caderno' && NB.dirty)) render(false); }
}, 250));

async function ponteGerar(){

    const { error } = await (await cloudClient()).rpc('agendainicial_definir_chave', { p_chave: chave });
    if (error) throw error;
    try { localStorage.setItem(PONTE_KEY, chave); } catch(e){}
    ui.chaveNova = chave; render(false);
    try { await navigator.clipboard.writeText(chave); toast('Chave copiada. Cole no computador do trabalho.'); } catch(e){}
  } catch(e){ toast('Não consegui gerar a chave: ' + e.message, 6000); }
}
function cloudSchedule(delay = 2500){ if (!CLOUD.user) return; clearTimeout(CLOUD.timer); CLOUD.timer = setTimeout(() => cloudSync(), delay); }
function applyRow(r){
  const del = r.excluido, d = r.dados || {};
  const upsert = (arr, key = 'id') => { const i = arr.findIndex(x => x[key] === r.id); if (del){ if (i >= 0) arr.splice(i, 1); } else if (i >= 0){ const keep = {}; for (const k of DEVICE_FIELDS) if (arr[i][k] !== undefined) keep[k] = arr[i][k]; arr[i] = Object.assign(d, keep); } else arr.push(d); };

    case 'registro': upsert(S.entries); break;
    case 'lista':
      if (!del && !SYNC.done){ const dup = S.lists.findIndex(l => l.id !== r.id && l.title === d.title && !(l.items || []).length && !(l.notes || '').trim()); if (dup >= 0){ const old = S.lists[dup].id; S.lists.splice(dup, 1); if (ui.listId === old) ui.listId = r.id; } }
      upsert(S.lists); break;
    case 'caderno': case 'arquivo': upsert(S.files); if (!del && r.tipo === 'caderno') pendingNbFiles.add(r.id); break;
    case 'dia': if (del) delete S.days[r.id]; else S.days[r.id] = d; break;
    case 'ajuste':
      if (r.id === 'perfil') S.profile = Object.assign({}, S.profile, d);
      if (r.id === 'ponto') S.ponto = Object.assign({ done: {} }, d);
      if (r.id === 'google') S.google = Object.assign({}, S.google, d);
      if (r.id === 'ajustes'){ const keep = {}; for (const k of DEVICE_SETTINGS) if (S.settings[k] !== undefined) keep[k] = S.settings[k]; S.settings = Object.assign({}, d, keep); resetHolidayCache(); }
      break;
  }
}
const pendingNbFiles = new Set();
function aplicarAdiadas(){

    const localHash = local ? hashStr(JSON.stringify(clean(local))) : null;
    if (local && localHash !== SYNC.sent[key]) continue;        // você mudou enquanto editava: a sua versão vale e será enviada
    applyRow(r); SYNC.sent[key] = r.excluido ? '×' : hashStr(JSON.stringify(clean(r.dados || {}))); mudou = true;
  }
  if (mudou){ saveSync(); try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} clearTimeout(saveTimer); saveTimer = setTimeout(writeDisk, 300); EDIT.pend = true; }

async function writePulledNotebooks(){

    pendingNbFiles.delete(id);
    const f = S.files.find(x => x.id === id); if (!f || typeof f.md !== 'string') continue;
    try { let cur = null; try { cur = await (await fileOf(f)).text(); } catch(e){} if (cur !== f.md){ await writeRel(f.path, new Blob([f.md], { type: 'text/markdown' })); f.fileTime = Date.now() + 1500; } } catch(e){}

async function cloudSync(full){
  if (!CLOUD.user || !navigator.onLine) { if (CLOUD.user) { CLOUD.state = 'offline'; renderSide(); } return; }
  if (CLOUD.busy){ CLOUD.again = true; return; }
  CLOUD.busy = true; CLOUD.state = 'sync'; renderSide();
  try {
    const viaPonte = CLOUD.via === 'ponte';
    const sb = viaPonte ? null : await cloudClient();
    const ler = async from => {
      if (viaPonte){ const d = await ponte('ler', { desde: from, limite: 500 }); return d.itens || []; }
      const { data, error } = await sb.from('agendainicial_itens').select('tipo,id,dados,excluido,alterado_em,atualizado').gt('atualizado', from).order('atualizado', { ascending: true }).limit(500);
      if (error) throw error; return data;
    };
    const gravar = async rows => {
      if (viaPonte) return ponte('gravar', { itens: rows });
      const { error } = await sb.from('agendainicial_itens').upsert(rows, { onConflict: 'usuario,tipo,id' });
      if (error) throw error;
    };
    // 1. buscar o que mudou em outros aparelhos
    let changed = false, from = full && !SYNC.done ? '1970-01-01T00:00:00Z' : SYNC.pulled;
    for (;;){
      const data = await ler(from);
      const items = cloudItems();
      const emEdicao = chavesEmEdicao();
      for (const r of data){
        const key = r.tipo + ':' + r.id, local = items.get(key);
        const localHash = local ? hashStr(JSON.stringify(clean(local))) : null;
        const localDirty = local ? localHash !== SYNC.sent[key] : false;
        from = r.atualizado;
        if (localDirty && local && SYNC.done) continue;          // alteração local ainda não enviada: a local vale
        const remotoHash = r.excluido ? '×' : hashStr(JSON.stringify(clean(r.dados || {})));
        if (local && !r.excluido && remotoHash === localHash){ SYNC.sent[key] = remotoHash; continue; }   // é o eco do que este aparelho enviou: nada muda
        if (emEdicao.has(key)){ EDIT.linhas.push(r); continue; }   // está sendo editado agora: aplica quando sair do campo
        applyRow(r); changed = true;
        SYNC.sent[key] = r.excluido ? '×' : hashStr(JSON.stringify(clean(r.dados || {})));
        from = r.atualizado;
      }
      SYNC.pulled = from;
      if (data.length < 500) break;
    }
    if (changed){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} clearTimeout(saveTimer); saveTimer = setTimeout(writeDisk, 300); writePulledNotebooks(); }
    // 2. enviar o que mudou aqui (inclui exclusões)
    const items = cloudItems(), now = Date.now(), up = [];
    for (const [key, obj] of items){
      const h = hashStr(JSON.stringify(clean(obj)));
      if (SYNC.sent[key] !== h){ const [tipo, ...rest] = key.split(':'); up.push({ tipo, id: rest.join(':'), dados: clean(obj), excluido: false, alterado_em: now, _h: h, _k: key }); }
    }
    for (const key of Object.keys(SYNC.sent)) if (!items.has(key) && SYNC.sent[key] !== '×'){ const [tipo, ...rest] = key.split(':'); up.push({ tipo, id: rest.join(':'), dados: {}, excluido: true, alterado_em: now, _h: '×', _k: key }); }
    for (let i = 0; i < up.length; i += 200){
      const chunk = up.slice(i, i + 200);
      await gravar(chunk.map(({ _h, _k, ...row }) => row));
      for (const r of chunk) SYNC.sent[r._k] = r._h;
    }
    SYNC.done = true; saveSync();
    grupoPuxar(); if (NUV.conectadas === null) nuvemConectadas();
    CLOUD.state = 'ok'; CLOUD.last = Date.now(); CLOUD.error = '';
    if (changed) renderBg();
  } catch(e){
    if (CLOUD.via === 'direto' && netError(e) && ponteChave()){ CLOUD.via = 'ponte'; CLOUD.busy = false; return cloudSync(full); }
    CLOUD.state = 'erro'; CLOUD.error = netError(e) ? 'sem conexão com o servidor' : (e.message || String(e));
    console.warn('Sincronização', e);
  } finally {
    CLOUD.busy = false; renderSide();
    if (CLOUD.again){ CLOUD.again = false; cloudSchedule(800); }
  }
}
function cloudLine(){

/* ---------------- Perfil do grupo Inicial (o mesmo do Termo Inicial) ---------------- */
// Em comum: nome e inscrição na OAB. O resto do perfil (matrícula, cargo, e-mail e telefone da empresa) é só da agenda.
const GRUPO = { timer: null, last: 0, busy: false };
const fmtOab = n => String(n || '').replace(/\D/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
function parseOab(txt){
  const t = String(txt || '').trim();
  if (!t) return { oab_numero: '', oab_uf: '' };
  const m = t.match(/OAB\s*[\/\-–]?\s*([A-Za-z]{2})\D*([\d.]{3,9})/i) || t.match(/^([\d.]{3,9})\s*[\/\-–]\s*([A-Za-z]{2})$/);
  if (!m) return null;
  const [uf, num] = /^\d/.test(m[1]) ? [m[2], m[1]] : [m[1], m[2]];
  return { oab_numero: num.replace(/\D/g, ''), oab_uf: uf.toUpperCase() };
}
async function grupoRpc(gravar, dados){
  if (CLOUD.via === 'ponte') return ponte('rpc', gravar ? { fn: 'agendainicial_ponte_perfil_gravar', args: { p_dados: dados } } : { fn: 'agendainicial_ponte_perfil' });
  const sb = await cloudClient();
  const { data, error } = gravar ? await sb.rpc('inicial_perfil_gravar', { d: dados }) : await sb.rpc('inicial_perfil');
  if (error) throw error; return data;
}
function grupoAplicar(p){
  if (!p){ if (S.profile.grupo){ delete S.profile.grupo; save(false); } return; }
  const P = S.profile, antes = JSON.stringify([P.name, P.registro]), primeira = !P.grupo;
  const oabLocal = parseOab(P.registro);
  if (p.nome) P.name = p.nome;
  if (p.oab_numero && p.oab_uf) P.registro = `OAB/${p.oab_uf} nº ${fmtOab(p.oab_numero)}`;
  else if (oabLocal && oabLocal.oab_numero && !primeira) P.registro = '';
  P.grupo = { at: p.atualizado };
  fotoDoGrupo(p);
  if (primeira && !p.oab_numero && oabLocal && oabLocal.oab_numero) grupoAgendar();   // a OAB só existia na agenda: leva para o Termo Inicial
  save(false);

const fotoUrl = p => p && p.foto_caminho ? `${SB_URL}/storage/v1/object/public/fotos-perfil/${p.foto_caminho.split('/').map(encodeURIComponent).join('/')}` : (p && p.foto_google) || '';
// Foto em 4×5 (retrato), recortada pelo centro, com o rosto mais perto do topo.
async function fotoReduzir(blob, largura){
  const bmp = await createImageBitmap(blob);
  let sw = bmp.width, sh = Math.round(sw * 5 / 4);
  if (sh > bmp.height){ sh = bmp.height; sw = Math.round(sh * 4 / 5); }
  const sx = Math.round((bmp.width - sw) / 2), sy = Math.round((bmp.height - sh) * 0.3);
  const W = Math.min(largura, sw), H = Math.round(W * 5 / 4);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  c.getContext('2d').drawImage(bmp, sx, sy, sw, sh, 0, 0, W, H);
  return new Promise(r => c.toBlob(r, 'image/jpeg', .86));
}
const blobParaDados = b => new Promise((r, j) => { const f = new FileReader(); f.onload = () => r(f.result); f.onerror = j; f.readAsDataURL(b); });
async function fotoDoGrupo(p){

  try { const r = await fetch(url, { mode: 'cors' }); if (!r.ok) throw new Error(r.status); P.foto = await blobParaDados(await fotoReduzir(await r.blob(), 240)); P.fotoFormato = '4x5'; }
  catch(e){ if (CLOUD.via === 'ponte' && url.startsWith(SB_URL)) return; P.foto = url; }   // sem acesso direto: usa o endereço da imagem

/* ---------------- Anexos na nuvem (OneDrive / Google Drive, a mesma conexão do Termo Inicial) ---------------- */
// O Termo Inicial entrega um acesso de 1 h; os arquivos vão direto do navegador para a Microsoft / o Google,
// em Documentos/Agenda Inicial/arquivos/AAAA-MM — a mesma estrutura da pasta local.
const TERMO_NUVEM = 'https://termoinicial.vercel.app/api/agenda-inicial/nuvem';   // o Termo Inicial entrega o acesso (a credencial fica no servidor dele)
const NUV = { tok: {}, conectadas: null, fila: Promise.resolve(), enviando: 0 };

async function nuvemFuncao(corpo){

  const r = await fetch(TERMO_NUVEM, { method: 'POST', headers: { authorization: `Bearer ${data.session ? data.session.access_token : ''}`, 'content-type': 'application/json' }, body: JSON.stringify(corpo) });

async function nuvemConectadas(forcar){

    if (esc_ && NUV.conectadas.some(c => c.provedor === esc_)){ try { await nuvemToken(esc_); NUV.pronto[esc_] = true; } catch(e){ NUV.erro = e.message; } }

async function nuvemToken(prov){

async function odPedir(url, init = {}){
  const tk = await nuvemToken('onedrive');
  const r = await fetch(url.startsWith('http') ? url : 'https://graph.microsoft.com/v1.0' + url, { ...init, headers: { authorization: 'Bearer ' + tk, ...(init.headers || {}) } });
  if (!r.ok){ let m = r.status; try { const j = await r.json(); m = (j.error && j.error.message) || m; } catch(e){} throw new Error('OneDrive: ' + m); }
  return r;

async function odEnviar(blob, rel){
  const alvo = `/me/drive/special/documents:/${encPath('Agenda Inicial/' + rel)}:`;
  if (blob.size <= 4 * 1024 * 1024) return (await odPedir(`${alvo}/content?@microsoft.graph.conflictBehavior=replace`, { method: 'PUT', body: blob })).json();
  const ses = await (await odPedir(`${alvo}/createUploadSession`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ item: { '@microsoft.graph.conflictBehavior': 'replace' } }) })).json();
  const PED = 320 * 1024 * 20; let ini = 0, fim, r;
  while (ini < blob.size){
    fim = Math.min(ini + PED, blob.size);
    r = await fetch(ses.uploadUrl, { method: 'PUT', headers: { 'content-range': `bytes ${ini}-${fim - 1}/${blob.size}` }, body: blob.slice(ini, fim) });
    if (!r.ok && r.status !== 202) throw new Error('OneDrive: envio interrompido (' + r.status + ')');
    ini = fim;
  }
  return r.json();
}
async function gdPedir(url, init = {}){

async function gdPasta(caminho){   // Documentos/Agenda Inicial/arquivos/AAAA-MM, criando o que faltar (o Drive só mostra ao app o que ele criou)

    const q = `name='${nome.replace(/'/g, "\\'")}' and '${pai}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`;
    const l = await (await gdPedir('https://www.googleapis.com/drive/v3/files?fields=files(id)&q=' + encodeURIComponent(q))).json();

const UP = { notes: null, checked: 0, error: '', newer: null };
const verNum = v => String(v || '0').split('.').map(n => parseInt(n, 10) || 0).reduce((a, n) => a * 1000 + n, 0);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: window-controls-overlay)').matches;
async function checkUpdate(manual){
  if (!/^https?:$/.test(location.protocol)) return;
  try {
    const r = await fetch('versao.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('versão indisponível');
    const m = await r.json(); UP.checked = Date.now(); UP.error = '';
    if (m.version === APP_RELEASE) UP.notes = m.notes || [];
    UP.newer = verNum(m.version) > verNum(APP_RELEASE) ? m : null;
    if (UP.newer){ const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); }
    if (manual) toast(UP.newer ? `Versão ${m.version} disponível. Recarregando…` : `Você está na versão mais recente (${APP_RELEASE}).`);
    if (UP.newer && manual) setTimeout(() => location.reload(), 800);
    if (S.settings.notesSeen !== APP_RELEASE && UP.notes){ const had = !!S.settings.notesSeen || S.entries.length > 0; S.settings.notesSeen = APP_RELEASE; save(false); if (had) toast(`Agenda atualizada para a versão ${APP_RELEASE}. Veja as novidades em Configurações.`, 5000); }
  } catch(e){ UP.error = e.message; if (manual) toast('Sem conexão para verificar agora.'); }
  renderSide(); if (ui.view === 'config') render(false);
}

async function showViewer(){
  vCleanup();

  const body = $('#vbody'), tabs = $('#vtabs');
  body.className = 'vbody'; tabs.innerHTML = ''; V.zoom = 1;

  let file;
  try { file = await fileOf(item); } catch(e){ if (tok === V.token) vMsg('Não consegui abrir o arquivo', esc(e.message), item); return; }

    if (kind === 'pdf'){

    }
    else if (kind === 'md'){
      const html = await mdToHtml(await file.text(), true);
      if (tok !== V.token) return;
      body.innerHTML = `<div class="nb-view vzoom"><div class="nb-doc ro">${html}</div></div>`;
    }
    else if (kind === 'text'){
      let t = await file.text();
      if (ext === 'html' || ext === 'htm'){
        body.classList.add('flush');
        V.url = URL.createObjectURL(new Blob([t], { type: 'text/html' }));
        body.innerHTML = `<iframe sandbox="" src="${V.url}" title="${esc(item.name)}"></iframe>`;
      } else {
        if (ext === 'json'){ try { t = JSON.stringify(JSON.parse(t), null, 2); } catch(e){} }
        if (t.length > 2e6) t = t.slice(0, 2e6) + '\n\n[… arquivo muito grande, exibidos os primeiros 2 MB]';
        body.innerHTML = `<pre class="vtext vzoom">${esc(t)}</pre>`;
      }
    }
    else if (kind === 'docx'){
      await lib('jszip'); await lib('docx');
      if (tok !== V.token) return;
      body.innerHTML = '<div class="vdocx vzoom"><div id="vdoc"></div></div>';
      await window.docx.renderAsync(await file.arrayBuffer(), $('#vdoc'), null, { className: 'docx', inWrapper: true, breakPages: true, renderHeaders: true, renderFooters: true, renderFootnotes: true, renderEndnotes: true, useBase64URL: true, experimental: true });
    }
    else if (kind === 'sheet'){
      await lib('xlsx');
      if (tok !== V.token) return;
      const data = ext === 'csv' || ext === 'tsv' ? await file.text() : await file.arrayBuffer();
      const wb = window.XLSX.read(data, { type: typeof data === 'string' ? 'string' : 'array', cellDates: true, dense: false, FS: ext === 'tsv' ? '\t' : undefined });
      V.wb = wb; V.sheet = 0;
      tabs.innerHTML = wb.SheetNames.map((n, i) => `<button data-act="v-sheet" data-i="${i}" class="${i ? '' : 'on'}">${esc(n)}</button>`).join('');
      renderSheet();
    }
    else if (kind === 'pptx'){
      await lib('jszip'); await lib('pptx');
      if (tok !== V.token) return;
      const buf = await file.arrayBuffer();
      let ratio = 9 / 16;
      try { const zx = await window.JSZip.loadAsync(buf); const px = await zx.file('ppt/presentation.xml').async('string'); const m = px.match(/<p:sldSz[^>]*cx="(\d+)"[^>]*cy="(\d+)"/); if (m) ratio = +m[2] / +m[1]; } catch(e){}

      await pv.preview(buf);

      vMsg('Este formato não tem visualização dentro da agenda', 'Arquivos .' + esc(ext) + ' abrem melhor no aplicativo de origem.', item);
    }

  } catch(e){
    console.warn(e);
    if (tok === V.token) vMsg('Não consegui exibir este arquivo', esc(e.message || 'O arquivo pode estar corrompido ou protegido por senha.'), item);

}
function renderSheet(){
  const X = window.XLSX, ws = V.wb.Sheets[V.wb.SheetNames[V.sheet]];
  $$('#vtabs button').forEach((b, i) => b.classList.toggle('on', i === V.sheet));
  if (!ws || !ws['!ref']){ $('#vbody').innerHTML = '<div class="vmsg"><div><b>Planilha vazia</b></div></div>'; return; }
  const r = X.utils.decode_range(ws['!ref']); const MAXR = 3000, MAXC = 200;
  const r2 = Math.min(r.e.r, r.s.r + MAXR - 1), c2 = Math.min(r.e.c, r.s.c + MAXC - 1);
  const skip = new Set(), span = {};
  for (const m of ws['!merges'] || []){
    span[m.s.r + ',' + m.s.c] = [m.e.r - m.s.r + 1, m.e.c - m.s.c + 1];
    for (let R = m.s.r; R <= m.e.r; R++) for (let C = m.s.c; C <= m.e.c; C++) if (R !== m.s.r || C !== m.s.c) skip.add(R + ',' + C);
  }
  const cols = ws['!cols'] || [];
  let h = '<table><thead><tr><th></th>';
  for (let C = r.s.c; C <= c2; C++) h += `<th style="min-width:${Math.max(48, Math.min(360, ((cols[C] && (cols[C].wpx || (cols[C].wch || 0) * 7)) || 72)))}px">${X.utils.encode_col(C)}</th>`;
  h += '</tr></thead><tbody>';
  for (let R = r.s.r; R <= r2; R++){
    h += `<tr><th>${R + 1}</th>`;
    for (let C = r.s.c; C <= c2; C++){
      const k = R + ',' + C; if (skip.has(k)) continue;
      const cell = ws[X.utils.encode_cell({ r: R, c: C })];
      const sp = span[k] ? ` rowspan="${span[k][0]}" colspan="${span[k][1]}"` : '';
      let txt = '', cls = '';
      if (cell){
        if (cell.f && (cell.v === undefined || cell.v === '')){ txt = '=' + cell.f; cls = 'f'; }
        else if (cell.w !== undefined) txt = cell.w;
        else if (cell.v instanceof Date) txt = cell.v.toLocaleDateString('pt-BR');
        else if (cell.v !== undefined) txt = String(cell.v);
        else if (cell.f){ txt = '=' + cell.f; cls = 'f'; }
        if (cell.t === 'n' && !cls) cls = 'n';
      }
      h += `<td class="${cls}"${sp} title="${esc(cell && cell.f ? '=' + cell.f : txt)}">${esc(txt)}</td>`;
    }
    h += '</tr>';
  }
  h += '</tbody></table>';
  if (r.e.r > r2 || r.e.c > c2) h += `<div class="more">Exibindo as primeiras ${r2 - r.s.r + 1} linhas e ${c2 - r.s.c + 1} colunas. Para ver tudo, abra no Excel.</div>`;
  $('#vbody').innerHTML = `<div class="vsheet vzoom">${h}</div>`;
  applyZoom();
}

async function mdLibs(){ await lib('marked'); }
async function htmlLibs(){ await lib('turndown'); await lib('gfm'); }
function encPath(p){ return p.split('/').map(encodeURIComponent).join('/'); }
function sanitize(root){
  root.querySelectorAll('script,style,iframe,object,embed,form,input,button,link,meta').forEach(n => n.remove());
  root.querySelectorAll('*').forEach(n => { for (const a of [...n.attributes]){ if (/^on/i.test(a.name) || (a.name === 'href' && /^\s*javascript:/i.test(a.value)) || a.name === 'style') n.removeAttribute(a.name); } });
}
async function mdToHtml(md, readonly){
  await mdLibs();

  box.innerHTML = window.marked.parse(md || '', { gfm: true, breaks: false });
  sanitize(box);
  box.querySelectorAll('a[href]').forEach(a => {
    let h = a.getAttribute('href') || '';
    try { h = decodeURIComponent(h); } catch(e){}
    h = h.replace(/^<|>$/g, '');
    const m = h.match(/^(?:\.\.\/)?((?:arquivos|cadernos)\/.+)$/);
    if (m){ const span = document.createElement('a'); span.className = 'mention' + (m[1].startsWith('cadernos/') ? ' nb' : ''); span.dataset.path = m[1]; span.dataset.name = a.textContent; span.textContent = a.textContent; span.setAttribute('contenteditable', 'false'); span.href = '#'; a.replaceWith(span); }
    else { a.setAttribute('target', '_blank'); a.setAttribute('rel', 'noopener'); }

let _td = null;
function turndown(){
  if (_td) return _td;
  _td = new window.TurndownService({ headingStyle: 'atx', bulletListMarker: '-', codeBlockStyle: 'fenced', emDelimiter: '*', strongDelimiter: '**', hr: '---' });
  _td.use(window.turndownPluginGfm.gfm);
  _td.addRule('mention', { filter: n => n.nodeName === 'A' && n.classList.contains('mention'), replacement: (c, n) => `[${(n.dataset.name || n.textContent).replace(/[\[\]]/g, '')}](../${encPath(n.dataset.path)})` });
  _td.addRule('underline', { filter: ['u', 'ins'], replacement: c => c.trim() ? `<u>${c}</u>` : c });
  _td.addRule('strike2', { filter: ['s', 'strike', 'del'], replacement: c => c.trim() ? `~~${c}~~` : c });
  _td.addRule('listItem1', { filter: 'li', replacement: (content, node) => {
    const par = node.parentNode; let prefix = '- ';
    if (par.nodeName === 'OL'){ const st = par.getAttribute('start'); const idx = Array.prototype.indexOf.call(par.children, node); prefix = (st ? Number(st) + idx : idx + 1) + '. '; }
    content = content.replace(/^\n+/, '').replace(/\n+$/, '\n').replace(/\n/gm, '\n' + ' '.repeat(prefix.length));
    return prefix + content + (node.nextSibling && !/\n$/.test(content) ? '\n' : '');
  } });
  _td.addRule('cellBreak', { filter: n => n.nodeName === 'BR' && n.closest && n.closest('td,th'), replacement: () => '' });
  _td.addRule('emptyPara', { filter: n => (n.nodeName === 'P' || n.nodeName === 'DIV') && !n.textContent.trim() && !n.querySelector('img,.mention'), replacement: () => '\n' });
  _td.addRule('spanStyled', { filter: n => n.nodeName === 'SPAN' && !n.classList.length, replacement: c => c });
  return _td;
}

  if (blk.id === 'nbdoc'){ const p = document.createElement('p'); n.replaceWith(p); if (rest){ p.textContent = rest; target = p.firstChild; } else { p.innerHTML = '<br>'; target = p; } }

  if (t.id === 'nbdoc'){
    if (NB.pop){
      if (ev.key === 'ArrowDown'){ ev.preventDefault(); return nbPopMove(1); }
      if (ev.key === 'ArrowUp'){ ev.preventDefault(); return nbPopMove(-1); }
      if ((ev.key === 'Enter' || ev.key === 'Tab') && NB.pop.items.length){ ev.preventDefault(); return nbPopPick(NB.pop.i); }
      if (ev.key === 'Escape'){ ev.preventDefault(); return nbPopClose(); }

    if (ev.key === 'Tab' && nbTableTab(ev)) return;
    if (nbAutoFormat(ev)) return;
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's'){ ev.preventDefault(); NB.dirty = true; nbSave(); }
    return;
  }
  if (t.id === 'nb-title' && ev.key === 'Enter'){ ev.preventDefault(); $('#nbdoc').focus(); return; }
  if (!$('#viewer').hidden){
    if (ev.key === 'Escape'){ ev.preventDefault(); closeViewer(); return; }
    if (ev.key === 'ArrowLeft' && V.list.length > 1 && t.tagName !== 'INPUT'){ ev.preventDefault(); ACT['v-prev'](); return; }
    if (ev.key === 'ArrowRight' && V.list.length > 1 && t.tagName !== 'INPUT'){ ev.preventDefault(); ACT['v-next'](); return; }
    if ((ev.key === '+' || ev.key === '=') && !ev.ctrlKey){ ev.preventDefault(); ACT['v-zin'](); return; }
    if (ev.key === '-' && !ev.ctrlKey){ ev.preventDefault(); ACT['v-zout'](); return; }
    return;
  }
  if (t.id === 'qtext' && ev.key === 'Enter'){ ev.preventDefault(); quickAdd(); }
  if (t.id === 'litext' && ev.key === 'Enter'){ ev.preventDefault(); ACT['li-add'](); }
  if (t.dataset && t.dataset.fadd && ev.key === 'Enter'){
    ev.preventDefault(); const mk = t.dataset.fadd; const raw = t.value.trim(); if (!raw) return;
    const day = $(`[data-fday="${mk}"]`).value; const q = parseQuick(raw);
    const date = day ? `${mk}-${pad(+day)}` : null;
    addEntry({ type: q.type || (date ? 'event' : 'task'), text: q.text, date, month: mk, time: q.time, prio: q.prio });
    save(); setTimeout(() => { const n = $(`[data-fadd="${mk}"]`); n && n.focus(); }, 0);
  }
  if (t.id === 'subtext'){
    if (ev.key === 'Escape' || (ev.key === 'Enter' && !t.value.trim())){ ev.preventDefault(); ui.subFor = null; render(false); return; }
    if (ev.key === 'Enter'){ ev.preventDefault(); const q = parseQuick(t.value); addEntry({ type: q.type || ui.subType || 'task', text: q.text, parent: t.dataset.parent, prio: q.prio || ui.subPrio, time: q.time }); ui.focusSub = true; save(); return; }
  }
  if (t.hasAttribute && t.hasAttribute('data-li-edit') && ['Enter','Tab','Backspace'].includes(ev.key)){
    const items = curList().items, idx = items.findIndex(x => x.id === t.closest('.check').dataset.iid), it = items[idx]; if (!it) return;
    const v = t.textContent.trim();
    if (ev.key === 'Enter'){ ev.preventDefault(); if (!v){ t.blur(); return; } it.text = v; const n = { id: uid(), text: '', done: false, level: it.level || 0 }; items.splice(listRange(items, idx), 0, n); ui.focusItem = n.id; save(); }
    else if (ev.key === 'Tab'){
      ev.preventDefault(); if (v) it.text = v;
      const end = listRange(items, idx), block = items.slice(idx, end), lv = it.level || 0;
      if (ev.shiftKey){ if (!lv) return; block.forEach(x => x.level--); }
      else { const prev = items[idx - 1]; if (lv >= MAXSUB) return toast(`O limite é de ${MAXSUB} níveis.`); if (!prev) return toast('Não há item acima para servir de principal.'); if (lv > (prev.level || 0)) return toast('Este item já está um nível abaixo do item de cima.'); if (Math.max(...block.map(x => x.level || 0)) + 1 > MAXSUB) return toast(`O limite é de ${MAXSUB} níveis.`); block.forEach(x => x.level = (x.level || 0) + 1); }
      ui.focusItem = it.id; save();
    }
    else if (ev.key === 'Backspace' && !v && listRange(items, idx) === idx + 1){ ev.preventDefault(); const prev = items[idx - 1]; items.splice(idx, 1); if (prev) ui.focusItem = prev.id; save(); }
  }
  if (!['INPUT','TEXTAREA','SELECT'].includes(t.tagName) && !t.isContentEditable && !ev.ctrlKey && !ev.metaKey && !ev.altKey){
    if (ev.key === 'n' && ui.view === 'hoje'){ ev.preventDefault(); $('#qtext').focus(); }
    if (ev.key === 'ArrowLeft' && ui.view === 'hoje') ACT['day-prev']();
    if (ev.key === 'ArrowRight' && ui.view === 'hoje') ACT['day-next']();
    if (ev.key === 't'){ ui.date = today(); go('hoje'); }
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'nbdoc'){ nbChanged(); nbMentionCheck(); return; }
  if (t.id === 'att-q'){ attachPicker(t.dataset.e, t.value); return; }
  if (t.id === 'daynotes'){ autosize(t); (S.days[ui.date] = S.days[ui.date] || {}).notes = t.value; if (!t.value) delete S.days[ui.date]; save(false); }
  if (t.id === 'lnotes'){ autosize(t); S.lists.find(x => x.id === ui.listId).notes = t.value; save(false); }
  if (t.id === 'ltitle'){ S.lists.find(x => x.id === ui.listId).title = t.value; save(false); renderSide(); }
  if (t.dataset && t.dataset.prof){ S.profile[t.dataset.prof] = t.value; save(false); renderSide(); refreshProfilePreview(); if (t.dataset.prof === 'name' || t.dataset.prof === 'registro') grupoAgendar(); }
  if (t.id === 'fq'){ ui.fq = t.value; const pos = t.selectionStart; render(false); const n = $('#fq'); n.focus(); n.setSelectionRange(pos, pos); }
  if (t.id === 'win-path'){ S.settings.winPath = t.value.trim(); save(false); }
  if (t.id === 'g-cal'){ S.google.calName = t.value.trim() || 'Cagece'; save(false); }
  if (t.id === 'ponto-url'){ S.ponto.url = t.value.trim(); save(false); }
});
function refreshProfilePreview(){
  const P = S.profile, pv = $('#rp-prev'); if (!pv) return;
  pv.innerHTML = rpHeader('Registro do dia', `${longDate(today())} de ${today().slice(0,4)}`);
  if (!P.foto) $('#pf-av').textContent = initials(P.name); $('#pf-name').textContent = P.name || 'Seu nome';
  $('#pf-line').textContent = [P.cargo, P.setor, P.unidade, P.empresa].filter(Boolean).join(' · ') || 'Complete o perfil abaixo';
}
document.addEventListener('focusout', ev => {
  const t = ev.target;
  if (ui.rendering) return;
  if (t.hasAttribute && t.hasAttribute('data-li-edit')){
    const l = curList(); if (!l) return; const idx = l.items.findIndex(x => x.id === t.closest('.check').dataset.iid); const it = l.items[idx]; if (!it) return;
    const v = t.textContent.trim();
    if (!v && listRange(l.items, idx) === idx + 1){ l.items.splice(idx, 1); normLevels(l.items); setTimeout(() => save(), 0); }
    else if (v !== it.text){ it.text = v; save(false); }
  }
});
document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.id === 'fpick'){ await uploadFiles(t.files, t.dataset.link || '', t.dataset.entry || ''); t.value = ''; }
  if (t.id === 'pk-date'){ linkPicker(t.dataset.fid, t.value); }
  if (t.id === 'nuvemProv'){ S.settings.nuvemProv = t.value === 'nenhuma' ? '' : t.value; save(false); await nuvemConectadas(true); render(false); }
  if (t.id === 'nb-block'){ nbBlock(t.value); }
  if (t.id === 'nb-title'){ nbRename(t.value); }
  if (t.dataset && t.dataset.att){ if (t.checked) ui.att.add(t.dataset.att); else ui.att.delete(t.dataset.att); }
  if (t.dataset && t.dataset.pick){ if (t.checked) ui.pick.add(t.dataset.pick); else ui.pick.delete(t.dataset.pick); const h = $('.pickhead span'); if (h) h.textContent = ui.pick.size + ' selecionado(s)'; }
  if (t.id === 'fpick1' && t.files[0]){
    try { const r = await storeFile(t.files[0], 'arquivos/Ponto'); S.files.push({ id: uid(), name: r.name, path: r.path, size: r.size, date: today(), addedAt: Date.now(), link: '', entries: [] }); S.ponto.file = { name: r.name, path: r.path }; S.ponto.kind = 'file'; save(); toast('Arquivo do ponto vinculado.'); } catch(e){ if (e.message !== 'sem pasta') toast('Não consegui gravar o arquivo.'); }
    t.value = '';
  }
  if (t.id === 'ponto-from' && t.value){ const f = S.files.find(x => x.id === t.value); S.ponto.file = { name: f.name, path: f.path }; save(); toast('Arquivo do ponto vinculado.'); }
  if (t.id === 'ponto-copy'){ S.ponto.monthlyCopy = t.checked; save(); }
  if (t.id === 'g-push'){ S.google.pushDefault = t.checked; save(false); }
  if (t.id === 'city-hol'){ S.settings.cityHolidays = t.checked; resetHolidayCache(); save(); }
  if (t.dataset && t.dataset.pdf){ S.profile.pdf[t.dataset.pdf] = t.checked; save(false); refreshProfilePreview(); }
  if (t.id === 'logopick' && t.files[0]){
    const f = t.files[0];
    const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });
    S.settings.logo = data; const im = new Image(); im.onload = () => { S.settings.logoWide = im.width / im.height > 1.6; save(); }; im.src = data;
    if (FS.state === 'granted'){ try { const d = await dirAt('assets'); const fh = await d.getFileHandle('logo-cagece.' + (extOf(f.name) || 'png'), { create: true }); const w = await fh.createWritable(); await w.write(f); await w.close(); } catch(e){} }
    t.value = '';
  }
  if (t.id === 'vpick' && t.files[0]){ const f = t.files[0]; openViewer([{ name: f.name, file: f }], 0); t.value = ''; }
  if (t.id === 'importpick' && t.files[0]){
    try { const d = JSON.parse(await t.files[0].text()); if (!d.entries) throw 0; if (!confirm('Substituir os dados atuais pelos do arquivo importado?')) return; S = migrate(d); resetHolidayCache(); save(); toast('Cópia importada.'); } catch(e){ toast('Arquivo inválido.'); }
    t.value = '';
  }
});
// Arrastar e soltar arquivos
document.addEventListener('dragover', ev => { const d = ev.target.closest && ev.target.closest('#drop'); if (d){ ev.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', ev => { const d = ev.target.closest && ev.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', ev => { const d = ev.target.closest && ev.target.closest('#drop'); if (d){ ev.preventDefault(); d.classList.remove('over'); uploadFiles(ev.dataTransfer.files); } });
$('#main').addEventListener('scroll', () => { const tb = $('.topbar'); tb && tb.classList.toggle('scrolled', $('#main').scrollTop > 4); });
window.addEventListener('beforeunload', () => { if (NB.dirty) nbSave(); });
window.addEventListener('storage', ev => { if (ev.key === LS_KEY && ev.newValue){ S = migrate(JSON.parse(ev.newValue)); render(false); } });
// Virada do dia com a agenda aberta
setInterval(() => { if (ui._today !== today()){ const was = ui._today; ui._today = today(); if (was && ui.view === 'hoje' && ui.date === was && !editando()){ ui.date = today(); } renderBg(); } }, 60000);

/* ---------------- Início ---------------- */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window._bip = e; renderSide(); if (ui.view === 'config') render(false); });
window.addEventListener('appinstalled', () => { window._bip = null; renderSide(); toast('Agenda Inicial instalada. Ela agora abre como aplicativo, com ícone próprio.', 5000); });
if (/^https?:$/.test(location.protocol) && 'serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded && UP.newer){ reloaded = true; location.reload(); } });
}
(async function start(){
  ui._today = today();
  { const h = location.hash.slice(1); if (['hoje','cal','futuro','cadernos','arquivos','ponto','perfil','config'].includes(h)) ui.view = h; }
  if (location.hash.startsWith('#ver=')){
    const path = decodeURIComponent(location.hash.slice(5)); V.only = true;
    document.body.classList.add('vonly'); applyTheme(); document.title = path.split('/').pop() + ' · Agenda Inicial';
    await initFS();
    const f = S.files.find(x => x.path === path) || { name: path.split('/').pop(), path };
    if (FS.state === 'granted') openViewer([f], 0);
    else if (!FS.root){ openViewer([f], 0); $('#vbody').innerHTML = '<div class="vmsg"><div><b>Pasta ainda não autorizada</b>Abra a Agenda Inicial e clique em Autorizar; depois tente de novo.</div></div>'; }
    else { openViewer([f], 0); $('#vbody').innerHTML = '<div class="vmsg"><div><b>Clique aqui para liberar o acesso à pasta</b>O navegador pede uma confirmação ao abrir uma janela nova.</div></div>'; window.addEventListener('pointerdown', async () => { try { if (FS.root && await FS.root.requestPermission({ mode: 'readwrite' }) === 'granted'){ FS.state = 'granted'; showViewer(); } } catch(e){} }, { once: true }); }
    return;
  }
  applyTheme();
  render(false);
  await initFS();
  render();
  if (pontoInfo().pending) document.title = '• Ponto pendente · Agenda Inicial';
  setTimeout(() => checkUpdate(), 1500);
  setInterval(() => checkUpdate(), 6 * 3600 * 1000);
  if (ponteChave() && !localStorage.getItem('agendaInicial.sessao') && SYNC.user){ CLOUD.via = 'ponte'; CLOUD.user = { id: SYNC.user, email: 'conectada pela ponte do Google' }; cloudSync(); }
  else if (/^https?:$/.test(location.protocol) && (localStorage.getItem('agendaInicial.sessao') || /[?&]code=/.test(location.search))){
    try { const sb = await cloudClient(); const { data } = await sb.auth.getSession(); if (data && data.session && !CLOUD.user){ CLOUD.user = data.session.user; SYNC.user = CLOUD.user.id; saveSync(); cloudSync(true); } } catch(e){ console.warn(e); }
  }
})();
